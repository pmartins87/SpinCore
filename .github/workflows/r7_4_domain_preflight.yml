name: SpinCore R7.4 exact-source HU and 3H structural preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_4_domain_preflight.yml'
      - 'tools/run_r7_4_domain_preflight.py'
      - 'tools/r7_4_domain_preflight_worker.py'
  workflow_run:
    workflows:
      - 'SpinCore R7.4 SPINRULESET-4 HU invariance'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spincore-r7-4-domain-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve strict or provisional R7.3 strategy prerequisite and accepted SPINRULESET-4 source
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import r7_3_certification_evidence as resolver
          import run_r7_4_domain_preflight as preflight

          f=json.load(open('validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json'))
          rf=json.load(open('validation/R7_4_RULESET_EXTENSION_FREEZE.json'))
          ra=json.load(open('validation/R7_4_RULESET_ACCEPTANCE.json'))
          chosen=None
          origin=None
          errors=[]

          try:
              a,strict_origin=resolver.resolve_valid_json(
                  'validation/R7_3_FROZEN_CANDIDATE_640_ACCEPTANCE.json',
                  validator=lambda d: preflight._validate_r7_3_prerequisites(f,d),
                  repo_root='.',
              )
              source=preflight._validate_ruleset_prerequisites(f,a,rf,ra)
          except Exception as exc:
              errors.append('strict='+repr(exc))
          else:
              chosen=a
              origin=strict_origin

          if chosen is None:
              p=Path('validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json')
              try:
                  a=json.loads(p.read_text(encoding='utf-8'))
                  preflight._validate_r7_3_prerequisites(f,a)
                  source=preflight._validate_ruleset_prerequisites(f,a,rf,ra)
              except Exception as exc:
                  errors.append('provisional='+repr(exc))
              else:
                  chosen=a
                  origin={'path':str(p),'mode':'PROVISIONAL_640_STRATEGY_QUALITY'}

          if chosen is None:
              print('R7.4 preflight remains gated:', '; '.join(errors))
              Path('/tmp/r7_4_preflight_gate.txt').write_text('false',encoding='utf-8')
          else:
              Path('/tmp/R7_3_ACCEPTANCE_FOR_R7_4.json').write_text(
                  json.dumps(chosen,indent=2,sort_keys=True)+'\n',encoding='utf-8'
              )
              Path('/tmp/r7_4_preflight_gate.txt').write_text('true',encoding='utf-8')
              print('accepted rules source',source)
              print('R7.3 prerequisite origin',origin)
              print('R7.3 prerequisite mode',preflight._acceptance_mode(chosen))
          PY
          echo "run=$(cat /tmp/r7_4_preflight_gate.txt)" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run frozen SPINRULESET-4 HU/3H preflight
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_r7_4_domain_preflight.py \
            --freeze validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json \
            --acceptance /tmp/R7_3_ACCEPTANCE_FOR_R7_4.json \
            --ruleset-freeze validation/R7_4_RULESET_EXTENSION_FREEZE.json \
            --ruleset-acceptance validation/R7_4_RULESET_ACCEPTANCE.json \
            --out validation/R7_4_DOMAIN_PREFLIGHT.json
      - name: Persist structural R7.4 preflight
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          out=validation/R7_4_DOMAIN_PREFLIGHT.json
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_4_DOMAIN_PREFLIGHT_V1","runner_failed_before_report":true,"r7_4_structural_preflight_pass":false,"r7_4_strategic_pilot_pass":false,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record frozen-SPINRULESET-4 HU and 3H structural preflight [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Enforce structural-only R7.4 preflight
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('validation/R7_4_DOMAIN_PREFLIGHT.json'))
          assert d.get('r7_4_structural_preflight_pass') is True, d
          assert d.get('r7_3_640_strategy_prerequisite_passed_first') is True
          assert d.get('r7_3_prerequisite_mode') in ('STRICT_EXACT_CERTIFICATION','PROVISIONAL_640_STRATEGY_QUALITY')
          if d.get('r7_3_prerequisite_mode') == 'PROVISIONAL_640_STRATEGY_QUALITY':
              assert d.get('r7_3_exact_reproducibility_debt_preserved') is True
              assert d.get('r7_3_640_acceptance_passed_first') is False
          assert d.get('r7_4_hu_invariance_passed_first') is True
          assert d.get('exact_frozen_r7_4_rules_source_used') is True
          assert d.get('preflight_worker_executed_from_rules_worktree_overlay') is True
          assert d.get('r7_4_strategic_pilot_pass') is False
          assert d.get('r7_4_strategic_gate_defined') is True
          assert d.get('ready_for_tables') is False
          print('R7.4 frozen-SPINRULESET-4 structural preflight PASS; precommitted held-out gate may begin.')
          PY
