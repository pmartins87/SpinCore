name: SpinCore R7.5.3C x4 chance-coverage readmission

on:
  push:
    paths:
      - '.github/workflows/r7_5_3c_chance_coverage_x4_readmission.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: spincore-r7-5-3c-x4-chance-coverage-readmission
  cancel-in-progress: false

env:
  HELDOUT_RUN_ID: '31866538984'
  HELDOUT_SHA: 'dfe5f83742495a457e92b29f97db5d3b631bca22'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      execution_sha: ${{ steps.freeze.outputs.execution_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify frozen x4 remediation before any output
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          f=json.loads(Path('validation/R7_5_3C_CHANCE_COVERAGE_X4_READMISSION_FREEZE_20260816.json').read_text())
          e=json.loads(Path('validation/R7_5_3C_SAMPLING_SPLIT_EVIDENCE_20260816.json').read_text())
          assert f['schema']=='SPINCORE_R7_5_3C_CHANCE_COVERAGE_X4_READMISSION_FREEZE_V1'
          assert f['status']=='FROZEN_BEFORE_CHANCE_COVERAGE_X4_OUTPUTS'
          assert f['trigger']['source_result_sha256']=='6655f5fcea3788a15e6a0671b00ad7d98b15e0f87f8dcdadc2ded57de5d46304'
          assert f['trigger']['classification']=='DECK_CHANCE_DOMINANT'
          assert e['classification']=='DECK_CHANCE_DOMINANT'
          r=f['remediation']
          assert r['coverage_multiplier']==4 and r['roots_per_iteration_effective']==256
          assert r['runner_safe_root_chunks_per_iteration']==4 and r['roots_per_chunk']==64
          assert r['fit_once_after_all_four_chunks'] is True
          assert r['training_seeds']==[1342191342,1801739323] and r['training_seeds_remain_independent'] is True
          assert r['deck_seed_function_unchanged'] is True and r['global_root_sequence_contiguous_across_chunks'] is True
          assert r['advantage_steps_per_member_per_iteration']==4096 and r['average_policy_steps']==16384
          g=f['hard_gates_unchanged']
          assert g['advantage_nrmse_max_each_iteration']==0.75
          assert g['final_policy_weighted_mean_tv_max']==0.12
          assert g['cross_seed_mean_tv_max']==0.15 and g['cross_seed_p95_tv_max']==0.35
          for table in ('code_blobs','inherited_code_blobs'):
              for path, expected in f[table].items():
                  actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
                  assert actual==expected,(path,actual,expected)
          gov=f['governance']
          assert gov['chance_coverage_output_seen_before_freeze'] is False
          assert not gov['may_select_h2_or_h3'] and not gov['may_change_phase2_thresholds']
          assert not gov['may_authorize_h4'] and not gov['may_authorize_r7_5_4_spnniv3_action_sizing_revalidation'] and not gov['may_authorize_r8']
          assert not gov['production_training_authorized'] and not gov['ready_for_tables']
          PY
          echo "execution_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install runtime and compile frozen tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'
          PYTHONPATH="$PWD/python:$PWD/tools" python -m py_compile \
            tools/r7_5_3c_chance_coverage_x4_domain_worker.py \
            tools/r7_5_3c_chance_coverage_x4_stability.py
      - name: Build immutable solver and run C++ regression
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Validate all eight inherited Phase 2 contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python - <<'PY'
          from spincore.r7_5_representation_v3_stage_contract import validate_phase2_v3_contract
          reps=['H2_RELATIONAL_EXACT_STRUCTURED_HISTORY_FINAL','H3_HYBRID_EXACT_SEMANTIC_FINAL']
          domains=['TRUE_HEADS_UP','THREE_HANDED']
          seeds=[1342191342,1801739323]
          for rep in reps:
              for domain in domains:
                  for seed in seeds:
                      validate_phase2_v3_contract('.', representation=rep, domain=domain, training_seed=seed)
          print('ALL 8 X4 BASE CONTRACTS VALID')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r7-5-3c-x4-solver-${{ steps.freeze.outputs.execution_sha }}
          path: build/libspincore_solver_c.so
          if-no-files-found: error
          retention-days: 30

  i1c1:
    needs: gate
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 1
      root_chunk: 1
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i1c2:
    needs: [gate, i1c1]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 1
      root_chunk: 2
      input_stage: i1c1
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i1c3:
    needs: [gate, i1c2]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 1
      root_chunk: 3
      input_stage: i1c2
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i1c4:
    needs: [gate, i1c3]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 1
      root_chunk: 4
      input_stage: i1c3
      execution_sha: ${{ needs.gate.outputs.execution_sha }}

  i2c1:
    needs: [gate, i1c4]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 2
      root_chunk: 1
      input_stage: i1c4
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i2c2:
    needs: [gate, i2c1]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 2
      root_chunk: 2
      input_stage: i2c1
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i2c3:
    needs: [gate, i2c2]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 2
      root_chunk: 3
      input_stage: i2c2
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i2c4:
    needs: [gate, i2c3]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 2
      root_chunk: 4
      input_stage: i2c3
      execution_sha: ${{ needs.gate.outputs.execution_sha }}

  i3c1:
    needs: [gate, i2c4]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 3
      root_chunk: 1
      input_stage: i2c4
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i3c2:
    needs: [gate, i3c1]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 3
      root_chunk: 2
      input_stage: i3c1
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i3c3:
    needs: [gate, i3c2]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 3
      root_chunk: 3
      input_stage: i3c2
      execution_sha: ${{ needs.gate.outputs.execution_sha }}
  i3c4:
    needs: [gate, i3c3]
    uses: ./.github/workflows/r7_5_3c_chance_coverage_x4_chunk_reusable.yml
    with:
      target_iteration: 3
      root_chunk: 4
      input_stage: i3c3
      finalize: true
      execution_sha: ${{ needs.gate.outputs.execution_sha }}

  stability:
    needs: [gate, i3c4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen policy evaluation runtime
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'
      - name: Download all eight final x4 checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3c-x4-*-i3c4-${{ needs.gate.outputs.execution_sha }}
          path: final
      - name: Download frozen heldout corpora
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3c-heldout-*-${{ env.HELDOUT_SHA }}
          path: heldout
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HELDOUT_RUN_ID }}
      - name: Evaluate unchanged hard cross-seed stability gates
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p output
          python tools/r7_5_3c_chance_coverage_x4_stability.py \
            --repo-root . \
            --input-root final \
            --heldout-root heldout \
            --training-execution-sha '${{ needs.gate.outputs.execution_sha }}' \
            --source-evidence validation/R7_5_3C_SAMPLING_SPLIT_EVIDENCE_20260816.json \
            --out output/R7_5_3C_CHANCE_COVERAGE_X4_STABILITY_RESULT.json
          sha256sum output/R7_5_3C_CHANCE_COVERAGE_X4_STABILITY_RESULT.json | tee output/RESULT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r7-5-3c-x4-stability-result-${{ needs.gate.outputs.execution_sha }}
          path: output
          if-no-files-found: error
          retention-days: 30
