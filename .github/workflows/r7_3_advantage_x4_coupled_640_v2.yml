name: SpinCore R7.3 Advantage x4 coupled 640 V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_advantage_x4_coupled_640_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spincore-r7-3-advantage-x4-coupled-640-v2
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Smoke V2 exact-deck candidate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_replicated_640_candidate_v2.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_REPLICATED_V2_SMOKE.json \
            --iterations 2 \
            --roots-per-iteration 2 \
            --advantage-replicates 2 \
            --strategy-replicates 1 \
            --rng-contract coupled \
            --advantage-chunk-steps 8 \
            --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 \
            --policy-chunk-steps 8 \
            --policy-max-steps 8 \
            --policy-fit-target 10 \
            --batch-size 16 \
            --audit-size 32 \
            --cross-seed-per-seed 16 \
            --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_REPLICATED_V2_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_REPLICATED_640_CANDIDATE_V2'
          assert d['sampling_schedule']['deck_semantics']=='GENERATION2_AUTHORITATIVE_GLOBAL_ROOT_FORMULA_EXACT'
          assert d['sampling_schedule']['global_root_continuous_across_iterations'] is True
          assert d['ready_for_tables'] is False
          print('replicated V2 smoke OK')
          PY

      - name: Run physical deck-exact coupled Advantage x4 640
        id: candidate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set +e
          python tools/run_r7_3_replicated_640_candidate_v2.py \
            --solver build/libspincore_solver_c.so \
            --out validation/R7_3_ADVANTAGE_X4_COUPLED_640_CANDIDATE_V2.json \
            --iterations 5 \
            --roots-per-iteration 128 \
            --advantage-replicates 4 \
            --strategy-replicates 1 \
            --rng-contract coupled \
            --advantage-chunk-steps 256 \
            --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 \
            --policy-chunk-steps 256 \
            --policy-max-steps 32768 \
            --policy-fit-target 0.105 \
            --batch-size 256 \
            --audit-size 1024 \
            --cross-seed-per-seed 1024 \
            --reservoir-capacity 400000 \
            --strict
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist deck-exact candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=validation/R7_3_ADVANTAGE_X4_COUPLED_640_CANDIDATE_V2.json
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_REPLICATED_640_CANDIDATE_V2","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record physical deck-exact R7.3 coupled Advantage x4 640 V2 [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Enforce frozen R7.3 gate
        if: always()
        shell: bash
        run: |
          code='${{ steps.candidate.outputs.exit_code }}'
          if [ -z "$code" ]; then code=3; fi
          exit "$code"
