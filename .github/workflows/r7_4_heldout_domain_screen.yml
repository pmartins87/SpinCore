name: SpinCore R7.4 held-out HU and 3H stability screen

on:
  workflow_run:
    workflows:
      - 'SpinCore R7.4 exact-source HU and 3H structural preflight'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spincore-r7-4-heldout-screen
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check accepted SPINRULESET-4 and structural R7.4 prerequisites
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          f=json.load(open('validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json'))
          rf=json.load(open('validation/R7_4_RULESET_EXTENSION_FREEZE.json'))
          ra=json.load(open('validation/R7_4_RULESET_ACCEPTANCE.json'))
          p=json.load(open('validation/R7_4_DOMAIN_PREFLIGHT.json'))
          assert f['schema']=='SPINCORE_R7_3_CANDIDATE_SEMANTIC_FREEZE_V1'
          assert rf['schema']=='SPINCORE_R7_4_RULESET_EXTENSION_V1'
          assert rf['ruleset_schema']=='SPINRULESET-4'
          assert ra['schema']=='SPINCORE_R7_4_RULESET_ACCEPTANCE_V1'
          assert ra['hu_invariance_pass'] is True
          assert ra['r7_4_rules_source_accepted'] is True
          assert ra['ready_for_tables'] is False
          assert p['schema']=='SPINCORE_R7_4_DOMAIN_PREFLIGHT_V1'
          assert p['r7_4_structural_preflight_pass'] is True
          assert p['r7_3_640_strategy_prerequisite_passed_first'] is True
          mode=p['r7_3_prerequisite_mode']
          assert mode in ('STRICT_EXACT_CERTIFICATION','PROVISIONAL_640_STRATEGY_QUALITY')
          if mode=='PROVISIONAL_640_STRATEGY_QUALITY':
              assert p['r7_3_exact_reproducibility_debt_preserved'] is True
              assert p['r7_3_640_acceptance_passed_first'] is False
              assert ra['r7_3_prerequisite_mode']==mode
              assert ra['r7_3_exact_reproducibility_debt_preserved'] is True
          assert p['r7_4_hu_invariance_passed_first'] is True
          assert p['exact_frozen_r7_4_rules_source_used'] is True
          assert p['preflight_worker_executed_from_rules_worktree_overlay'] is True
          assert p['r7_4_rules_source_head_sha']==rf['ruleset_extension_source_head_sha']==ra['ruleset_extension_source_head_sha']
          assert p['r7_3_frozen_source_head_sha']==f['source_head_sha']==rf['base_r7_3_source_head_sha']
          assert p['r7_3_durability_evidence_commit_sha']==f['evidence_commit_sha']==rf['base_r7_3_evidence_commit_sha']
          assert p['ready_for_tables'] is False
          PY
          echo 'run=true' >> "$GITHUB_OUTPUT"

  domain:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hu640
            domain: TRUE_HEADS_UP
            roots_per_iteration: 128
            out: validation/R7_4_HELDOUT_HU_640.json
          - label: three320
            domain: THREE_HANDED
            roots_per_iteration: 64
            out: validation/R7_4_HELDOUT_3H_320.json
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select R7.3 strategy prerequisite
        id: prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          p=json.load(open('validation/R7_4_DOMAIN_PREFLIGHT.json'))
          mode=p['r7_3_prerequisite_mode']
          if mode=='STRICT_EXACT_CERTIFICATION':
              path='validation/R7_3_FROZEN_CANDIDATE_640_ACCEPTANCE.json'
          elif mode=='PROVISIONAL_640_STRATEGY_QUALITY':
              path='validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json'
          else:
              raise SystemExit('unknown R7.3 prerequisite mode: '+repr(mode))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('path='+path+'\n')
          print(mode,path)
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
      - name: Run frozen-SPINRULESET-4 held-out domain pilot
        id: physical
        continue-on-error: true
        shell: bash
        env:
          DOMAIN: ${{ matrix.domain }}
          ROOTS: ${{ matrix.roots_per_iteration }}
          OUT: ${{ matrix.out }}
          R7_ACCEPTANCE: ${{ steps.prerequisite.outputs.path }}
        run: |
          set -euo pipefail
          python tools/run_r7_4_stability_pilot.py \
            --freeze validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json \
            --acceptance "$R7_ACCEPTANCE" \
            --ruleset-freeze validation/R7_4_RULESET_EXTENSION_FREEZE.json \
            --ruleset-acceptance validation/R7_4_RULESET_ACCEPTANCE.json \
            --preflight validation/R7_4_DOMAIN_PREFLIGHT.json \
            --domain "$DOMAIN" \
            --roots-per-iteration "$ROOTS" \
            --out "$OUT"
      - name: Persist held-out domain evidence
        if: always()
        shell: bash
        env:
          DOMAIN: ${{ matrix.domain }}
          ROOTS: ${{ matrix.roots_per_iteration }}
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          if [ ! -f "$OUT" ]; then
            printf '{"schema":"SPINCORE_R7_4_HELDOUT_DOMAIN_STABILITY_V1","domain":"%s","roots_per_iteration":%s,"runner_failed_before_report":true,"r7_4_domain_stability_pass":false,"ready_for_tables":false}\n' "$DOMAIN" "$ROOTS" > "$OUT"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "Record R7.4 held-out ${{ matrix.label }} evidence [r7-evidence-skip]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

  summarize:
    needs: [gate, domain]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Summarize precommitted held-out screen
        shell: bash
        run: |
          set -euo pipefail
          python tools/summarize_r7_4_heldout_screen.py \
            --freeze validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json \
            --ruleset-freeze validation/R7_4_RULESET_EXTENSION_FREEZE.json \
            --ruleset-acceptance validation/R7_4_RULESET_ACCEPTANCE.json \
            --preflight validation/R7_4_DOMAIN_PREFLIGHT.json \
            --hu validation/R7_4_HELDOUT_HU_640.json \
            --three-handed validation/R7_4_HELDOUT_3H_320.json \
            --out validation/R7_4_HELDOUT_SCREEN_SUMMARY.json
      - name: Persist held-out screen summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f validation/R7_4_HELDOUT_SCREEN_SUMMARY.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record R7.4 held-out HU and 3H screen summary [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Report screen decision
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('validation/R7_4_HELDOUT_SCREEN_SUMMARY.json'))
          print(json.dumps(d, indent=2, sort_keys=True))
          assert d['ready_for_tables'] is False
          if d['r7_4_heldout_screen_pass']:
              print('R7.4 held-out screen PASS; 3H 640 confirmation is authorized.')
          else:
              print('R7.4 held-out screen did not pass; 3H 640 confirmation remains blocked.')
          PY
