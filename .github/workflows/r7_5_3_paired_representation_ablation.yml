name: SpinCore R7.5.3 paired representation ablation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spincore-r7-5-3-paired-representation-ablation
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      execution_sha: ${{ steps.freeze.outputs.execution_sha }}
    steps:
      - name: Checkout dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Freeze immutable execution SHA
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          execution_sha="$(git rev-parse HEAD)"
          test "$execution_sha" = "${GITHUB_SHA}"
          echo "execution_sha=$execution_sha" >> "$GITHUB_OUTPUT"
          echo "R7.5.3 immutable execution SHA: $execution_sha"

      - name: Validate precommitted experiment contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          pre = json.loads(Path('validation/R7_5_3_REPRESENTATION_ABLATION_PRECOMMIT.json').read_text())
          agg = json.loads(Path('validation/R7_5_3_AGGREGATION_IMPLEMENTATION_FREEZE.json').read_text())
          assert pre['schema'] == 'SPINCORE_R7_5_3_REPRESENTATION_ABLATION_PRECOMMIT_V1'
          assert agg['schema'] == 'SPINCORE_R7_5_3_AGGREGATION_IMPLEMENTATION_FREEZE_V1'
          assert pre['status'] == 'FROZEN_BEFORE_COMPARATIVE_LEARNING_OUTPUTS'
          assert agg['status'] == 'FROZEN_BEFORE_REAL_COMPARATIVE_OUTPUTS'
          assert pre['production_training_authorized'] is False
          assert pre['ready_for_tables'] is False
          assert agg['ready_for_tables'] is False
          assert len([x for x in pre['candidates'] if x['eligible_to_win']]) == 6
          assert pre['domains'] == ['TRUE_HEADS_UP', 'THREE_HANDED']
          assert pre['seed_derivation']['corpus_seeds'] == [1202035427, 2078778133]
          assert pre['seed_derivation']['fit_initialization_seeds'] == [2102028507, 1745216084, 971790437]
          assert pre['seed_derivation']['split_seed'] == 1925930899
          assert pre['paired_corpus']['bootstrap_roots_per_seed_domain'] == 128
          assert pre['paired_corpus']['initial_paired_roots_per_seed_domain'] == 64
          assert pre['paired_corpus']['coverage_extension_roots'] == 64
          assert pre['paired_corpus']['max_paired_roots_per_seed_domain'] == 192
          assert pre['candidate_fit']['advantage_optimizer_steps'] == 4096
          assert pre['candidate_fit']['policy_optimizer_steps'] == 8192
          assert not Path('validation/R7_5_3_REPRESENTATION_ABLATION_RESULT.json').exists(), (
              'real R7.5.3 result already exists; do not rerun a completed comparative gate'
          )
          PY

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5' pytest
          python - <<'PY'
          import platform, numpy, torch
          assert platform.python_version() == '3.11.15', platform.python_version()
          assert torch.__version__ == '2.13.0+cpu', torch.__version__
          assert numpy.__version__ == '2.3.5', numpy.__version__
          print({'python': platform.python_version(), 'torch': torch.__version__, 'numpy': numpy.__version__})
          PY

      - name: Build solver Release
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Full implementation regression at execution SHA
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure
          python -m compileall -q python tools python_tests
          pytest -q python_tests

      - name: Upload immutable solver library
        uses: actions/upload-artifact@v4
        with:
          name: r7-5-3-solver-${{ needs.gate.outputs.execution_sha }}
          path: build/libspincore_solver_c.so
          if-no-files-found: error
          retention-days: 14

  corpus:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        domain: [TRUE_HEADS_UP, THREE_HANDED]
        seed: [1202035427, 2078778133]
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'
          python - <<'PY'
          import platform, numpy, torch
          assert platform.python_version() == '3.11.15'
          assert torch.__version__ == '2.13.0+cpu'
          assert numpy.__version__ == '2.3.5'
          PY

      - name: Download immutable solver library
        uses: actions/download-artifact@v4
        with:
          name: r7-5-3-solver-${{ needs.gate.outputs.execution_sha }}
          path: build

      - name: Collect exactly paired corpus
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python tools/run_with_heartbeat.py \
            --label 'r7.5-corpus-${{ matrix.domain }}-${{ matrix.seed }}' \
            --interval-seconds 300 -- \
            python tools/r7_5_paired_corpus_worker.py \
              --lib build/libspincore_solver_c.so \
              --freeze validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json \
              --domain '${{ matrix.domain }}' \
              --seed '${{ matrix.seed }}' \
              --out-dir corpus \
              --device cpu \
              --bootstrap-roots 128 \
              --initial-paired-roots 64 \
              --extension-roots 64 \
              --max-paired-roots 192 \
              --min-advantage 5000 \
              --min-strategy 2000 \
              --capacity 100000

      - name: Upload paired corpus
        uses: actions/upload-artifact@v4
        with:
          name: r7-5-3-corpus-${{ matrix.domain }}-${{ matrix.seed }}
          path: corpus
          if-no-files-found: error
          retention-days: 14

  corpus_audit:
    needs: [gate, corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'

      - name: Download all paired corpora
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3-corpus-*
          path: corpora

      - name: Audit corpus provenance and semantic coverage
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find corpora -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#dirs[@]}" -eq 4
          args=()
          for d in "${dirs[@]}"; do
            args+=(--corpus-dir "$d")
          done
          python tools/r7_5_audit_paired_corpus.py \
            "${args[@]}" \
            --out evidence/R7_5_3_PAIRED_CORPUS_AUDIT.json

      - name: Upload corpus audit
        uses: actions/upload-artifact@v4
        with:
          name: r7-5-3-corpus-audit-${{ needs.gate.outputs.execution_sha }}
          path: evidence/R7_5_3_PAIRED_CORPUS_AUDIT.json
          if-no-files-found: error
          retention-days: 14

  fit:
    needs: [gate, corpus_audit]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        domain: [TRUE_HEADS_UP, THREE_HANDED]
        fit_seed: [2102028507, 1745216084, 971790437]
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'
          python - <<'PY'
          import platform, numpy, torch
          assert platform.python_version() == '3.11.15'
          assert torch.__version__ == '2.13.0+cpu'
          assert numpy.__version__ == '2.3.5'
          PY

      - name: Download domain corpus
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3-corpus-${{ matrix.domain }}-*
          path: corpora

      - name: Fit all six candidates on identical corpus
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mapfile -t advantages < <(find corpora -name advantage_pairs.pt -type f | sort)
          mapfile -t strategies < <(find corpora -name strategy_pairs.pt -type f | sort)
          test "${#advantages[@]}" -eq 2
          test "${#strategies[@]}" -eq 2

          adv_args=()
          strategy_args=()
          for f in "${advantages[@]}"; do adv_args+=(--advantage "$f"); done
          for f in "${strategies[@]}"; do strategy_args+=(--strategy "$f"); done

          candidates=(
            C0_V1_FROZEN_CONTROL
            C1_V2_NO_FLOP_TOKEN
            C2_V2_H1_CANONICAL_184
            C3_V2_H2_MIN_CHANGE_181
            C4_V2_H3_RECLUSTERED_184
            C5_V2_H4_EXACT_1755
          )
          mkdir -p fit_outputs
          for candidate in "${candidates[@]}"; do
            python tools/run_with_heartbeat.py \
              --label "r7.5-fit-${{ matrix.domain }}-${{ matrix.fit_seed }}-${candidate}" \
              --interval-seconds 300 -- \
              python tools/r7_5_fit_representation_candidate.py \
                --candidate "$candidate" \
                --domain '${{ matrix.domain }}' \
                --fit-seed '${{ matrix.fit_seed }}' \
                --split-seed 1925930899 \
                "${adv_args[@]}" \
                "${strategy_args[@]}" \
                --out "fit_outputs/${candidate}.pt" \
                --device cpu \
                --learning-rate 0.001 \
                --batch-size 256 \
                --advantage-steps 4096 \
                --policy-steps 8192 \
                --min-tag-samples 128
          done
          test "$(find fit_outputs -maxdepth 1 -name '*.pt' | wc -l)" -eq 6

      - name: Upload six fit outputs
        uses: actions/upload-artifact@v4
        with:
          name: r7-5-3-fit-${{ matrix.domain }}-${{ matrix.fit_seed }}
          path: fit_outputs
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [gate, fit, corpus_audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      aggregate_rc: ${{ steps.aggregate.outputs.aggregate_rc }}
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'

      - name: Download all fit outputs
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3-fit-*
          path: fits

      - name: Download corpus audit evidence
        uses: actions/download-artifact@v4
        with:
          name: r7-5-3-corpus-audit-${{ needs.gate.outputs.execution_sha }}
          path: evidence

      - name: Aggregate with frozen selection order
        id: aggregate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
        run: |
          set -euo pipefail
          mapfile -t fit_files < <(find fits -name '*.pt' -type f | sort)
          test "${#fit_files[@]}" -eq 36
          fit_args=()
          for f in "${fit_files[@]}"; do fit_args+=(--fit "$f"); done

          set +e
          python tools/r7_5_aggregate_representation_ablation.py \
            "${fit_args[@]}" \
            --precommit validation/R7_5_3_REPRESENTATION_ABLATION_PRECOMMIT.json \
            --aggregation-freeze validation/R7_5_3_AGGREGATION_IMPLEMENTATION_FREEZE.json \
            --out evidence/R7_5_3_REPRESENTATION_ABLATION_RESULT.json
          rc=$?
          set -e
          test -f evidence/R7_5_3_REPRESENTATION_ABLATION_RESULT.json
          echo "aggregate_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Aggregator semantic return code: $rc"

      - name: Write immutable execution manifest
        shell: bash
        env:
          EXECUTION_SHA: ${{ needs.gate.outputs.execution_sha }}
          AGGREGATE_RC: ${{ steps.aggregate.outputs.aggregate_rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          import numpy, torch
          result = json.loads(Path('evidence/R7_5_3_REPRESENTATION_ABLATION_RESULT.json').read_text())
          audit = json.loads(Path('evidence/R7_5_3_PAIRED_CORPUS_AUDIT.json').read_text())
          payload = {
              'schema': 'SPINCORE_R7_5_3_EXECUTION_MANIFEST_V1',
              'execution_sha': os.environ['EXECUTION_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'aggregate_rc': int(os.environ['AGGREGATE_RC']),
              'python': platform.python_version(),
              'torch': torch.__version__,
              'numpy': numpy.__version__,
              'corpus_coverage_pass': bool(audit['coverage_pass']),
              'representation_ablation_pass': bool(result['r7_5_3_representation_ablation_pass']),
              'selected_candidate': result['selected_candidate'],
              'production_training_authorized': False,
              'ready_for_tables': False,
          }
          assert payload['python'] == '3.11.15'
          assert payload['torch'] == '2.13.0+cpu'
          assert payload['numpy'] == '2.3.5'
          Path('evidence/R7_5_3_EXECUTION_MANIFEST.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload complete R7.5.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: r7-5-3-evidence-${{ needs.gate.outputs.execution_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  persist:
    needs: [gate, aggregate]
    runs-on: ubuntu-latest
    outputs:
      representation_pass: ${{ steps.read.outputs.representation_pass }}
      selected_candidate: ${{ steps.read.outputs.selected_candidate }}
    steps:
      - name: Download immutable computed evidence
        uses: actions/download-artifact@v4
        with:
          name: r7-5-3-evidence-${{ needs.gate.outputs.execution_sha }}
          path: computed

      - name: Read final gate before persistence
        id: read
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/r7_5_3_outputs
          import json
          from pathlib import Path
          r = json.loads(Path('computed/R7_5_3_REPRESENTATION_ABLATION_RESULT.json').read_text())
          print('representation_pass=' + ('true' if r['r7_5_3_representation_ablation_pass'] else 'false'))
          print('selected_candidate=' + str(r['selected_candidate'] or 'NONE'))
          assert r['production_training_authorized'] is False
          assert r['ready_for_tables'] is False
          PY
          cat /tmp/r7_5_3_outputs >> "$GITHUB_OUTPUT"

      - name: Checkout current main only for durable evidence persistence
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Persist result, corpus audit and execution manifest
        shell: bash
        env:
          EXECUTION_SHA: ${{ needs.gate.outputs.execution_sha }}
        run: |
          set -euo pipefail
          cp computed/R7_5_3_REPRESENTATION_ABLATION_RESULT.json validation/R7_5_3_REPRESENTATION_ABLATION_RESULT.json
          cp computed/R7_5_3_PAIRED_CORPUS_AUDIT.json validation/R7_5_3_PAIRED_CORPUS_AUDIT.json
          cp computed/R7_5_3_EXECUTION_MANIFEST.json validation/R7_5_3_EXECUTION_MANIFEST.json

          git config user.name 'SpinCore Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/R7_5_3_REPRESENTATION_ABLATION_RESULT.json \
                  validation/R7_5_3_PAIRED_CORPUS_AUDIT.json \
                  validation/R7_5_3_EXECUTION_MANIFEST.json
          if git diff --cached --quiet; then
            echo 'Evidence already persisted.'
            exit 0
          fi
          git commit -m "validation: persist R7.5.3 paired representation evidence ($EXECUTION_SHA)"
          git pull --rebase origin main
          git push origin HEAD:main

  enforce:
    needs: persist
    runs-on: ubuntu-latest
    steps:
      - name: Enforce frozen R7.5.3 strategic gate after evidence persistence
        shell: bash
        run: |
          set -euo pipefail
          echo "R7.5.3 selected candidate: ${{ needs.persist.outputs.selected_candidate }}"
          test '${{ needs.persist.outputs.representation_pass }}' = 'true'
          echo 'R7.5.3 representation ablation PASS. This authorizes R7.5.4 only; READY FOR TABLES remains false.'
