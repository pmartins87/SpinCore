name: SpinCore R7.3 paired policy-mixture 640 acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validation/TRIGGER_R7_3_POLICY_MIXTURE_640.txt'

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Smoke acceptance mapping and contract
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_partial_exact_policy_mixture_paired.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_POLICY_MIXTURE_640_SMOKE.json \
            --ensemble-size 4 --exact-opponent-levels 2 \
            --iterations 5 --roots-per-iteration 1 \
            --advantage-chunk-steps 8 --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 \
            --policy-chunk-steps 8 --policy-max-steps 8 --policy-fit-target 10 \
            --batch-size 16 --audit-size 32 --cross-seed-per-seed 16 \
            --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_POLICY_MIXTURE_640_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_PARTIAL_EXACT_POLICY_MIXTURE_PAIRED_V1'
          assert d['iterations']==5
          assert d['ensemble_size']==4
          assert d['exact_opponent_levels']==2
          assert d['ensemble_mapping']=='REGRET_MATCH_EACH_MEMBER_THEN_AVERAGE_POLICY'
          assert d['deck_formula']=='seed*1000003 + global_root*97 + iteration'
          assert d['extra_members_perturb_primary_rng'] is False
          assert d['acceptance_gate_changed'] is False
          assert d['ready_for_tables'] is False
          print('policy-mixture 640 acceptance smoke OK')
          PY

      - name: Run physical 640-root acceptance candidate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_partial_exact_policy_mixture_paired.py \
            --solver build/libspincore_solver_c.so \
            --out validation/R7_3_PARTIAL_EXACT_POLICY_MIXTURE_640_CANDIDATE.json \
            --ensemble-size 4 --exact-opponent-levels 2 \
            --iterations 5 --roots-per-iteration 128 \
            --advantage-chunk-steps 256 --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 \
            --policy-chunk-steps 256 --policy-max-steps 16384 --policy-fit-target 0.105 \
            --batch-size 256 --audit-size 512 --cross-seed-per-seed 1024 \
            --reservoir-capacity 100000

      - name: Persist acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=validation/R7_3_PARTIAL_EXACT_POLICY_MIXTURE_640_CANDIDATE.json
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_PARTIAL_EXACT_POLICY_MIXTURE_PAIRED_V1","iterations":5,"roots_per_seed":640,"runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record physical R7.3 policy-mixture 640 acceptance [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
