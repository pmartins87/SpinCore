name: SpinCore R7.5.4A V1 dense3H recovery step

on:
  workflow_call:
    inputs:
      source_execution_sha:
        required: true
        type: string
      recovery_execution_sha:
        required: true
        type: string
      solver_run_id:
        required: true
        type: number
      source_training_run_id:
        required: true
        type: number
      input_run_id:
        required: true
        type: number
      input_stage:
        required: true
        type: string
      output_stage:
        required: true
        type: string
      target_iteration:
        required: true
        type: number
      operation:
        required: true
        type: string
      final_artifact:
        required: false
        default: false
        type: boolean
    outputs:
      run_id:
        description: Workflow run containing this step's three output artifacts
        value: ${{ jobs.recover.outputs.run_id }}

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: '3.11.15'
  TORCH_VERSION: '2.13.0+cpu'
  NUMPY_VERSION: '2.3.5'
  CANDIDATE: PF_DENSE_REFERENCE
  DOMAIN: THREE_HANDED

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - seed: 1737995611
            source_artifact_id: 9224957740
            source_artifact_digest: 44231b6e8ac00da19bcca267511f8355490205baba8e758985419214111ac75a
            source_checkpoint_sha256: ea598ec624ee2e4e72fc8c3780c53863d6f116d5d9baa9495bcbbfe7cfadea2c
          - seed: 645939859
            source_artifact_id: 9225388016
            source_artifact_digest: 1b6ba187a83fe4f04b106dd3f7f9b8d6d1624776bc379d332114cd328e3ef7bc
            source_checkpoint_sha256: ba02b8a6b27da27b891c51a2e90bb437810ac2c44db6ca498375ca83be8cde09
          - seed: 1311335590
            source_artifact_id: 9224960149
            source_artifact_digest: ecbf14071085b7f1674d814cb9ff066d6d3db7f4c913dee8359822dab403db07
            source_checkpoint_sha256: 064713c596b6e860f25240c6b649aba00126346363aa5c6790c179ddb5e2e5ac
    steps:
      - name: Expose called-workflow run ID
        id: run
        shell: bash
        run: echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout recovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_execution_sha }}

      - name: Checkout immutable original training source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_execution_sha }}
          path: frozen-source

      - name: Set up exact original Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'

      - name: Install audited recovery module into frozen source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-source rev-parse HEAD)" = '${{ inputs.source_execution_sha }}'
          install -m 0644 \
            python/spincore/r7_5_action_stage_recovery.py \
            frozen-source/python/spincore/r7_5_action_stage_recovery.py

      - name: Resolve immutable artifact names
        id: names
        shell: bash
        env:
          INPUT_STAGE: ${{ inputs.input_stage }}
          OUTPUT_STAGE: ${{ inputs.output_stage }}
          FINAL_ARTIFACT: ${{ inputs.final_artifact }}
          SEED: ${{ matrix.seed }}
          SOURCE_SHA: ${{ inputs.source_execution_sha }}
          RECOVERY_SHA: ${{ inputs.recovery_execution_sha }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_STAGE" == 'original_i1' ]]; then
            input_name="r7-5-4a-160-PF_DENSE_REFERENCE-THREE_HANDED-${SEED}-i1-${SOURCE_SHA}"
          else
            input_name="r7-5-4a-160-recovery-PF_DENSE_REFERENCE-THREE_HANDED-${SEED}-${INPUT_STAGE}-${RECOVERY_SHA}"
          fi
          if [[ "$FINAL_ARTIFACT" == 'true' ]]; then
            output_name="r7-5-4a-160-final-PF_DENSE_REFERENCE-THREE_HANDED-${SEED}-${SOURCE_SHA}"
          else
            output_name="r7-5-4a-160-recovery-PF_DENSE_REFERENCE-THREE_HANDED-${SEED}-${OUTPUT_STAGE}-${RECOVERY_SHA}"
          fi
          echo "input_name=$input_name" >> "$GITHUB_OUTPUT"
          echo "output_name=$output_name" >> "$GITHUB_OUTPUT"

      - name: Download exact frozen solver
        uses: actions/download-artifact@v4
        with:
          name: r7-5-4a-160-recovery-solver-${{ inputs.recovery_execution_sha }}
          path: frozen-source/build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.solver_run_id }}

      - name: Download exact prior checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.names.outputs.input_name }}
          path: input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.input_run_id }}

      - name: Validate immutable recovery cell
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/frozen-source/python:${{ github.workspace }}/frozen-source/tools
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          test '${{ inputs.operation }}' = 'collect' || test '${{ inputs.operation }}' = 'finish'
          test -f input/checkpoint.pt
          test -f frozen-source/build/libspincore_solver_c.so
          python - <<'PY'
          import platform, torch, numpy
          torch.set_num_threads(2)
          assert platform.python_version() == '3.11.15'
          assert torch.__version__ == '2.13.0+cpu'
          assert numpy.__version__ == '2.3.5'
          assert torch.get_num_threads() == 2
          print('frozen recovery runtime PASS', platform.python_version(), torch.__version__, numpy.__version__)
          PY

      - name: Collect first 16 roots
        if: ${{ inputs.operation == 'collect' }}
        shell: bash
        env: &runtime_env
          PYTHONPATH: ${{ github.workspace }}/frozen-source/python:${{ github.workspace }}/frozen-source/tools
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p output
          python tools/run_with_heartbeat.py --label 'r7.5.4a-recovery-${{ inputs.output_stage }}-${{ matrix.seed }}' --interval-seconds 300 -- \
            python tools/r7_5_4a_160_dense3h_recovery_worker.py \
              --mode collect --repo-root frozen-source \
              --solver frozen-source/build/libspincore_solver_c.so \
              --training-seed '${{ matrix.seed }}' \
              --target-iteration '${{ inputs.target_iteration }}' --root-budget 16 \
              --resume input/checkpoint.pt \
              --checkpoint-out output/checkpoint.pt --report-out output/report.json \
              --source-execution-sha '${{ inputs.source_execution_sha }}' \
              --recovery-execution-sha '${{ inputs.recovery_execution_sha }}' \
              --source-training-run-id '${{ inputs.source_training_run_id }}' \
              --source-iteration1-artifact-id '${{ matrix.source_artifact_id }}' \
              --source-iteration1-artifact-digest '${{ matrix.source_artifact_digest }}' \
              --source-checkpoint-sha256 '${{ matrix.source_checkpoint_sha256 }}'

      - name: Collect remaining 16 roots and run frozen fit
        if: ${{ inputs.operation == 'finish' }}
        shell: bash
        env: *runtime_env
        run: |
          set -euo pipefail
          mkdir -p collected output
          python tools/run_with_heartbeat.py --label 'r7.5.4a-recovery-${{ inputs.output_stage }}-collect-${{ matrix.seed }}' --interval-seconds 300 -- \
            python tools/r7_5_4a_160_dense3h_recovery_worker.py \
              --mode collect --repo-root frozen-source \
              --solver frozen-source/build/libspincore_solver_c.so \
              --training-seed '${{ matrix.seed }}' \
              --target-iteration '${{ inputs.target_iteration }}' --root-budget 16 \
              --resume input/checkpoint.pt \
              --checkpoint-out collected/checkpoint.pt \
              --report-out collected/collection_report.json \
              --source-execution-sha '${{ inputs.source_execution_sha }}' \
              --recovery-execution-sha '${{ inputs.recovery_execution_sha }}' \
              --source-training-run-id '${{ inputs.source_training_run_id }}' \
              --source-iteration1-artifact-id '${{ matrix.source_artifact_id }}' \
              --source-iteration1-artifact-digest '${{ matrix.source_artifact_digest }}' \
              --source-checkpoint-sha256 '${{ matrix.source_checkpoint_sha256 }}'
          python tools/run_with_heartbeat.py --label 'r7.5.4a-recovery-${{ inputs.output_stage }}-fit-${{ matrix.seed }}' --interval-seconds 300 -- \
            python tools/r7_5_4a_160_dense3h_recovery_worker.py \
              --mode fit --repo-root frozen-source \
              --solver frozen-source/build/libspincore_solver_c.so \
              --training-seed '${{ matrix.seed }}' \
              --target-iteration '${{ inputs.target_iteration }}' --root-budget 16 \
              --resume collected/checkpoint.pt \
              --checkpoint-out output/checkpoint.pt --report-out output/report.json \
              --source-execution-sha '${{ inputs.source_execution_sha }}' \
              --recovery-execution-sha '${{ inputs.recovery_execution_sha }}' \
              --source-training-run-id '${{ inputs.source_training_run_id }}' \
              --source-iteration1-artifact-id '${{ matrix.source_artifact_id }}' \
              --source-iteration1-artifact-digest '${{ matrix.source_artifact_digest }}' \
              --source-checkpoint-sha256 '${{ matrix.source_checkpoint_sha256 }}'
          cp collected/collection_report.json output/collection_report.json

      - name: Verify stage output contract
        shell: bash
        run: |
          set -euo pipefail
          test -s output/checkpoint.pt
          test -s output/report.json
          python - <<'PY'
          import json
          p=json.load(open('output/report.json'))
          assert p['schema']=='SPINCORE_R7_5_4A_DENSE3H_RECOVERY_WORKER_V1'
          assert p['candidate_id']=='PF_DENSE_REFERENCE'
          assert p['domain']=='THREE_HANDED'
          assert p['training_seed']==${{ matrix.seed }}
          assert p['target_iteration']==${{ inputs.target_iteration }}
          assert p['source_execution_sha']=='${{ inputs.source_execution_sha }}'
          assert p['recovery_execution_sha']=='${{ inputs.recovery_execution_sha }}'
          assert p['production_training_authorized'] is False
          assert p['ready_for_tables'] is False
          if '${{ inputs.operation }}' == 'collect':
              assert p['roots_collected']==16 and p['finalized'] is False
          else:
              assert p['roots_collected']==32
              assert p['finalized'] is ('${{ inputs.final_artifact }}' == 'true')
          PY

      - name: Upload durable recovered checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.output_name }}
          path: output
          if-no-files-found: error
          retention-days: 14
