name: SpinCore R8.2 calibration readiness guard smoke

on:
  push:
    branches: [main]
    paths:
      - 'validation/R8_2_RYZEN_CALIBRATION_HANDOFF_PRECOMMIT_20260816.json'
      - 'tools/r8_2_calibration_readiness_guard.py'
      - 'tools/test_r8_2_calibration_readiness_guard.py'
      - '.github/workflows/r8_2_calibration_readiness_guard_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile guard and tests
        run: python -m py_compile tools/r8_2_calibration_readiness_guard.py tools/test_r8_2_calibration_readiness_guard.py
      - name: Run fail-closed readiness tests
        run: python tools/test_r8_2_calibration_readiness_guard.py
