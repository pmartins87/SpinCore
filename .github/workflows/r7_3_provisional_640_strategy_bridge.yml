name: SpinCore R7.3 provisional 640 strategy bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_provisional_640_strategy_bridge.yml'
      - 'tools/run_r7_3_provisional_640_strategy_acceptance.py'
      - 'validation/R7_3_EXACT_REPRO_DEFERRED_DECISION_20260812.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spincore-r7-3-provisional-640-strategy-bridge
  cancel-in-progress: false

jobs:
  strategy_640:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout latest main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies as frozen source workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Verify explicit deferral decision and unchanged frozen gate
        shell: bash
        run: |
          set -euo pipefail
          test -f validation/R7_3_EXACT_REPRO_DEFERRED_DECISION_20260812.md
          python - <<'PY'
          import json
          f=json.load(open('validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json'))
          ec=f['execution_contract']
          gates=f['frozen_gates']
          assert f['schema']=='SPINCORE_R7_3_CANDIDATE_SEMANTIC_FREEZE_V1'
          assert f['evidence_r7_3_pass'] is True
          assert f['ensemble_size']==4
          assert ec['exact_opponent_levels']==2
          assert ec['iterations']==5
          assert f['thread_environment_contract']=='SOURCE_WORKFLOW_NO_EXPLICIT_THREAD_OVERRIDE'
          assert gates == {
              'advantage_weighted_nrmse_max': 0.75,
              'cross_seed_mean_tv_max': 0.15,
              'cross_seed_p95_tv_max': 0.35,
              'policy_weighted_mean_tv_max': 0.12,
          }
          print('Frozen R7.3 candidate unchanged; exact-repro exception is explicit and release-blocking.')
          PY

      - name: Physical exact-source 5x128 strategy acceptance
        id: physical
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_r7_3_provisional_640_strategy_acceptance.py \
            --freeze validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json \
            --exact-repro-report validation/R7_3_FRESH_REPRO_LAST_REPORT.json \
            --evidence-out /tmp/R7_3_PROVISIONAL_640_STRATEGY_EVIDENCE.json \
            --report-out /tmp/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json

      - name: Materialize failure report if runner stopped early
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json ]; then
            cat > /tmp/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json <<'JSON'
          {
            "schema": "SPINCORE_R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE_V1",
            "runner_failed_before_report": true,
            "certification_sequence_exception": true,
            "exact_reproducibility_deferred": true,
            "exact_reproducibility_must_close_before_ready_for_tables": true,
            "r7_3_strategy_quality_640_pass": false,
            "r7_4_provisional_advance_allowed": false,
            "r7_3_fully_certified": false,
            "ready_for_tables": false
          }
          JSON
          fi

      - name: Persist provisional strategy evidence conflict-safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p validation
            cp /tmp/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json
            git add -f validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json
            if [ -f /tmp/R7_3_PROVISIONAL_640_STRATEGY_EVIDENCE.json ]; then
              cp /tmp/R7_3_PROVISIONAL_640_STRATEGY_EVIDENCE.json validation/R7_3_PROVISIONAL_640_STRATEGY_EVIDENCE.json
              git add -f validation/R7_3_PROVISIONAL_640_STRATEGY_EVIDENCE.json
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record provisional R7.3 640 strategy bridge [r7-evidence-skip]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to persist provisional R7.3 strategy evidence.' >&2
          exit 1

      - name: Upload provisional bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-3-provisional-640-strategy-bridge
          if-no-files-found: warn
          path: |
            validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json
            validation/R7_3_PROVISIONAL_640_STRATEGY_EVIDENCE.json

      - name: Enforce unchanged strategy-quality gates only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json
          d=json.load(open('validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json'))
          assert d['schema']=='SPINCORE_R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE_V1', d
          assert d.get('r7_3_strategy_quality_640_pass') is True, d
          assert d.get('r7_4_provisional_advance_allowed') is True
          assert d.get('per_seed_fit_pass') is True
          assert d.get('frozen_cross_seed_gates_pass') is True
          assert d.get('structural_contract_pass') is True
          assert d.get('strategic_acceptance_gate_changed') is False
          assert d.get('certification_sequence_exception') is True
          assert d.get('exact_reproducibility_must_close_before_ready_for_tables') is True
          assert d.get('r7_3_fully_certified') is False
          assert d.get('ready_for_tables') is False
          print('R7.3 provisional 640 STRATEGY gate PASS. Exact reproducibility remains separate release debt.')
          PY
