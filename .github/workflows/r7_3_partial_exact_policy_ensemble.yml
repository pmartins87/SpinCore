name: SpinCore R7.3 partial-exact final policy ensemble

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_partial_exact_policy_ensemble.yml'
      - 'tools/run_r7_3_partial_exact_policy_ensemble.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Smoke final policy ensemble runner
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_partial_exact_policy_ensemble.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_PARTIAL_EXACT_POLICY_ENSEMBLE_SMOKE.json \
            --iterations 2 \
            --roots-per-iteration 2 \
            --advantage-chunk-steps 8 \
            --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 \
            --policy-chunk-steps 8 \
            --policy-max-steps 8 \
            --policy-fit-target 10 \
            --batch-size 16 \
            --audit-size 32 \
            --cross-seed-per-seed 16 \
            --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_PARTIAL_EXACT_POLICY_ENSEMBLE_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_PARTIAL_EXACT_POLICY_ENSEMBLE_V1'
          assert d['deck_formula']=='seed*1000003 + global_root*97 + iteration'
          assert d['extra_policy_members_perturb_primary_rng'] is False
          assert set(d['cross_seed_by_policy_ensemble_size'])=={'1','2','4'}
          assert d['ready_for_tables'] is False
          print('partial-exact final policy ensemble smoke OK')
          PY

      - name: Run physical 256-root final policy ensemble screen
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_partial_exact_policy_ensemble.py \
            --solver build/libspincore_solver_c.so \
            --out validation/R7_3_PARTIAL_EXACT_POLICY_ENSEMBLE_256.json \
            --exact-opponent-levels 2 \
            --iterations 2 \
            --roots-per-iteration 128 \
            --advantage-chunk-steps 256 \
            --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 \
            --policy-chunk-steps 256 \
            --policy-max-steps 16384 \
            --policy-fit-target 0.105 \
            --batch-size 256 \
            --audit-size 512 \
            --cross-seed-per-seed 1024 \
            --reservoir-capacity 100000

      - name: Persist final policy ensemble evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=validation/R7_3_PARTIAL_EXACT_POLICY_ENSEMBLE_256.json
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_PARTIAL_EXACT_POLICY_ENSEMBLE_V1","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record R7.3 partial-exact final policy ensemble [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
