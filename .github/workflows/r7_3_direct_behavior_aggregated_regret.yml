name: SpinCore R7.3 aggregated-regret Direct Behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_direct_behavior_aggregated_regret.yml'
      - 'tools/run_r7_3_direct_behavior_aggregated_regret_e2e.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: short_256
            iterations: '2'
            roots_per_iteration: '128'
            out: 'validation/R7_3_DIRECT_BEHAVIOR_AGGREGATED_REGRET_256.json'
          - label: durability_320
            iterations: '5'
            roots_per_iteration: '64'
            out: 'validation/R7_3_DIRECT_BEHAVIOR_AGGREGATED_REGRET_320.json'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Smoke aggregated-regret Direct Behavior
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_direct_behavior_aggregated_regret_e2e.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_DIRECT_BEHAVIOR_AGGREGATED_REGRET_SMOKE.json \
            --iterations 2 --roots-per-iteration 1 \
            --exact-opponent-levels 2 \
            --advantage-chunk-steps 8 --advantage-max-steps-per-iteration 8 --advantage-fit-target 10 \
            --surrogate-chunk-steps 8 --surrogate-max-steps-per-iteration 8 --surrogate-fit-target 10 \
            --policy-chunk-steps 8 --policy-max-steps 8 --policy-fit-target 10 \
            --batch-size 16 --audit-size 32 --cross-seed-per-seed 16 --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_DIRECT_BEHAVIOR_AGGREGATED_REGRET_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_DIRECT_BEHAVIOR_AGGREGATED_REGRET_E2E_V1'
          assert d['surrogate_target_order']=='LCFR_WEIGHTED_MEAN_REGRET_PER_EXACT_INFOSET_THEN_HARD_REGRET_MATCHING'
          assert d['production_algorithm_changed'] is False
          assert d['theoretical_equivalence_claimed'] is False
          assert d['ready_for_tables'] is False
          print('aggregated-regret Direct Behavior smoke OK')
          PY

      - name: Run physical aggregated-regret candidate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_direct_behavior_aggregated_regret_e2e.py \
            --solver build/libspincore_solver_c.so \
            --out '${{ matrix.out }}' \
            --iterations '${{ matrix.iterations }}' \
            --roots-per-iteration '${{ matrix.roots_per_iteration }}' \
            --exact-opponent-levels 2 \
            --advantage-chunk-steps 256 --advantage-max-steps-per-iteration 4096 --advantage-fit-target 0.50 \
            --surrogate-chunk-steps 256 --surrogate-max-steps-per-iteration 4096 --surrogate-fit-target 0.105 \
            --policy-chunk-steps 256 --policy-max-steps 16384 --policy-fit-target 0.105 \
            --batch-size 256 --audit-size 512 --cross-seed-per-seed 1024 --reservoir-capacity 100000

      - name: Persist aggregated-regret evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out='${{ matrix.out }}'
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_DIRECT_BEHAVIOR_AGGREGATED_REGRET_E2E_V1","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record R7.3 aggregated-regret Direct Behavior ${{ matrix.label }} [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
