name: SpinCore R7.5.3C cross-seed parity audit
on:
  push:
    paths: ['.github/workflows/r7_5_3c_cross_seed_parity_audit.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: spincore-r7-5-3c-cross-seed-parity-audit
  cancel-in-progress: false
env:
  TRAINING_RUN_ID: '31865993350'
  TRAINING_SHA: '9b0ccc207135c3adaec76ea87de8ec21f7415957'
  HELDOUT_RUN_ID: '31866538984'
  HELDOUT_SHA: 'dfe5f83742495a457e92b29f97db5d3b631bca22'
  EVALUATOR_RUN_ID: '31887392458'
  EVALUATOR_SHA: 'e887564834df01b1d024fede9b89e678528f9ecf'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - name: Verify frozen parity-audit V2 retry adjudication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          v1=json.loads(Path('validation/R7_5_3C_CROSS_SEED_PARITY_AUDIT_FREEZE_20260815.json').read_text())
          v2=json.loads(Path('validation/R7_5_3C_CROSS_SEED_PARITY_AUDIT_ADJUDICATION_V2_20260815.json').read_text())
          assert v1['schema']=='SPINCORE_R7_5_3C_CROSS_SEED_PARITY_AUDIT_FREEZE_V1'
          assert v1['status']=='FROZEN_BEFORE_PARITY_AUDIT_OUTPUT'
          assert v2['schema']=='SPINCORE_R7_5_3C_CROSS_SEED_PARITY_AUDIT_ADJUDICATION_V2'
          assert v2['status']=='FROZEN_AFTER_ATTEMPT1_NUMERIC_FAILURE_BEFORE_ANY_ATTEMPT2_OUTPUT'
          assert v2['attempt1']['run_id']==31896022326 and v2['attempt1']['job_id']==95039349086
          assert v2['attempt1']['failure_before_result_artifact_upload'] is True
          assert v2['attempt1']['result_artifact_emitted'] is False
          assert v2['checker_edit_before_this_adjudication_commit']['attempt2_output_seen_before_edit'] is False
          assert v2['checker_edit_before_this_adjudication_commit']['attempt2_output_seen_before_this_freeze'] is False
          checker=v2['checker_edit_before_this_adjudication_commit']
          actual=subprocess.check_output(['git','hash-object',checker['checker_path']],text=True).strip()
          assert actual==checker['checker_git_blob'],(actual,checker['checker_git_blob'])
          for path, expected in v1['frozen_inherited_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          assert v2['attempt2_numerical_contract']['worker_vs_recomputed_policy_max_abs_tolerance']==1e-6
          assert v2['attempt2_numerical_contract']['stored_vs_recomputed_cross_seed_metric_abs_tolerance']==5e-6
          assert v2['attempt2_numerical_contract']['stored_cross_seed_metric_vs_persisted_blocker_evidence_abs_tolerance']==1e-12
          assert v2['attempt2_numerical_contract']['frozen_strategic_cross_seed_mean_tv_gate']==0.15
          assert v2['attempt2_numerical_contract']['frozen_strategic_cross_seed_p95_tv_gate']==0.35
          assert v2['attempt2_numerical_contract']['strategic_gate_changed'] is False
          assert v2['attempt2_numerical_contract']['selection_rule_changed'] is False
          assert v2['scope']['may_select_representation'] is False
          assert v2['scope']['may_relax_phase2_gate'] is False
          assert not v2['production_training_authorized'] and not v2['ready_for_tables']
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.15'}
      - name: Install frozen runtime dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'
      - name: Download original heldout worker cells
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3c-p2-eval-heldout-*-${{ env.EVALUATOR_SHA }}
          path: cells
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVALUATOR_RUN_ID }}
      - name: Download original extracted final AveragePolicy artifacts
        uses: actions/download-artifact@v4
        with:
          name: r7-5-3c-p2-light-policies-${{ env.EVALUATOR_SHA }}
          path: policies
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVALUATOR_RUN_ID }}
      - name: Download frozen heldout corpora
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3c-heldout-*-${{ env.HELDOUT_SHA }}
          path: heldout
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HELDOUT_RUN_ID }}
      - name: Run independent parity audit
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p output
          python tools/r7_5_3c_cross_seed_parity_audit.py \
            --repo-root . \
            --cells-root cells \
            --policies-root policies \
            --heldout-root heldout \
            --training-sha "$TRAINING_SHA" \
            --evaluator-sha "$EVALUATOR_SHA" \
            --heldout-sha "$HELDOUT_SHA" \
            --blocker-evidence validation/R7_5_3C_PHASE2_BLOCKER_EVIDENCE_20260815.json \
            --out output/R7_5_3C_CROSS_SEED_PARITY_AUDIT_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: r7-5-3c-cross-seed-parity-audit-${{ github.sha }}
          path: output/R7_5_3C_CROSS_SEED_PARITY_AUDIT_RESULT.json
          if-no-files-found: error
          retention-days: 30
