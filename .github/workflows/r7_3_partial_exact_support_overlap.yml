name: SpinCore R7.3 partial-exact support overlap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_partial_exact_support_overlap.yml'
      - 'tools/run_r7_3_partial_exact_support_overlap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests
      - name: Smoke partial-exact support forensic
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_partial_exact_support_overlap.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_PARTIAL_EXACT_SUPPORT_OVERLAP_SMOKE.json \
            --iterations 2 --roots-per-iteration 2 \
            --advantage-chunk-steps 8 --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 --policy-chunk-steps 8 --policy-max-steps 8 \
            --policy-fit-target 10 --batch-size 16 --audit-size 32 \
            --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_PARTIAL_EXACT_SUPPORT_OVERLAP_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_PARTIAL_EXACT_SUPPORT_OVERLAP_V1'
          assert d['deck_formula']=='seed*1000003 + global_root*97 + iteration'
          assert set(d['overlap'])=={'raw','suit_isomorphic','poker_isomorphic'}
          for mode in d['overlap'].values():
              assert 'by_street' in mode and 'by_legal_action_count' in mode and 'by_history_len' in mode
          assert d['ready_for_tables'] is False
          print('partial-exact support forensic smoke OK')
          PY
      - name: Run physical 256-root partial-exact support forensic
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_partial_exact_support_overlap.py \
            --solver build/libspincore_solver_c.so \
            --out validation/R7_3_PARTIAL_EXACT_SUPPORT_OVERLAP_256.json \
            --exact-opponent-levels 2 --iterations 2 --roots-per-iteration 128 \
            --advantage-chunk-steps 256 --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 --policy-chunk-steps 128 --policy-max-steps 128 \
            --policy-fit-target 10 --batch-size 256 --audit-size 512 \
            --reservoir-capacity 100000
      - name: Persist support forensic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=validation/R7_3_PARTIAL_EXACT_SUPPORT_OVERLAP_256.json
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_PARTIAL_EXACT_SUPPORT_OVERLAP_V1","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record physical R7.3 partial-exact support overlap [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
