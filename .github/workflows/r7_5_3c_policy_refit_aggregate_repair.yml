name: SpinCore R7.5.3C policy-refit aggregate repair

on:
  push:
    paths:
      - '.github/workflows/r7_5_3c_policy_refit_aggregate_repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: spincore-r7-5-3c-policy-refit-aggregate-repair
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '31896651181'
  SOURCE_EXECUTION_SHA: '7e4b07214032eed004f5ab214f428250e108a877'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_EXECUTION_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen metric runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'numpy==2.3.5'
      - name: Download all 16 immutable diagnostic refits
        uses: actions/download-artifact@v4
        with:
          pattern: r7-5-3c-policy-refit-*-${{ env.SOURCE_EXECUTION_SHA }}
          path: cells
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify exact frozen cell inventory and aggregate
        env:
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tools
        run: |
          set -euo pipefail
          test "$(find cells -name cell.json.gz | wc -l)" -eq 16
          mkdir -p output
          python tools/r7_5_3c_policy_refit_decomposition_aggregate.py \
            --cells-root cells \
            --blocker-evidence validation/R7_5_3C_PHASE2_BLOCKER_EVIDENCE_20260815.json \
            --out output/R7_5_3C_POLICY_REFIT_DECOMPOSITION_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: r7-5-3c-policy-refit-decomposition-result-repair-${{ env.SOURCE_EXECUTION_SHA }}
          path: output/R7_5_3C_POLICY_REFIT_DECOMPOSITION_RESULT.json
          if-no-files-found: error
          retention-days: 30
