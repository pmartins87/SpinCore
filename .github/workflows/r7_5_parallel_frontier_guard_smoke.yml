name: SpinCore R7.5.3C post-x4 frontier guard smoke

on:
  push:
    paths:
      - 'tools/r7_5_3c_post_x4_frontier_guard.py'
      - 'python_tests/test_r7_5_3c_post_x4_frontier_guard.py'
      - '.github/workflows/r7_5_parallel_frontier_guard_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Compile guard
        run: python -m py_compile tools/r7_5_3c_post_x4_frontier_guard.py python_tests/test_r7_5_3c_post_x4_frontier_guard.py
      - name: Install pytest
        run: python -m pip install 'pytest==9.0.2'
      - name: Run fail-closed transition tests
        run: python -m pytest -q python_tests/test_r7_5_3c_post_x4_frontier_guard.py
