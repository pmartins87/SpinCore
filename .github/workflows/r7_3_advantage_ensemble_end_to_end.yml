name: SpinCore R7.3 Advantage ensemble end-to-end

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_advantage_ensemble_end_to_end.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensemble:
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: 1
            out: validation/R7_3_ADV_ENSEMBLE_E2E_SIZE1_256.json
          - size: 2
            out: validation/R7_3_ADV_ENSEMBLE_E2E_SIZE2_256.json
          - size: 4
            out: validation/R7_3_ADV_ENSEMBLE_E2E_SIZE4_256.json
    name: size_${{ matrix.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Smoke ensemble CFR runner
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_advantage_ensemble_end_to_end.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_ADV_ENSEMBLE_E2E_SMOKE.json \
            --ensemble-size '${{ matrix.size }}' \
            --iterations 2 \
            --roots-per-iteration 2 \
            --advantage-chunk-steps 8 \
            --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 \
            --policy-chunk-steps 8 \
            --policy-max-steps 8 \
            --policy-fit-target 10 \
            --batch-size 16 \
            --audit-size 32 \
            --cross-seed-per-seed 16 \
            --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_ADV_ENSEMBLE_E2E_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_ADVANTAGE_ENSEMBLE_END_TO_END_V1'
          assert d['ready_for_tables'] is False
          print('Advantage ensemble E2E smoke OK')
          PY

      - name: Run physical 256-root ensemble CFR screen
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_advantage_ensemble_end_to_end.py \
            --solver build/libspincore_solver_c.so \
            --out '${{ matrix.out }}' \
            --ensemble-size '${{ matrix.size }}' \
            --iterations 2 \
            --roots-per-iteration 128 \
            --advantage-chunk-steps 256 \
            --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 \
            --policy-chunk-steps 256 \
            --policy-max-steps 16384 \
            --policy-fit-target 0.105 \
            --batch-size 256 \
            --audit-size 512 \
            --cross-seed-per-seed 1024 \
            --reservoir-capacity 100000

      - name: Persist ensemble E2E evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out='${{ matrix.out }}'
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_ADVANTAGE_ENSEMBLE_END_TO_END_V1","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record physical R7.3 Advantage ensemble E2E size ${{ matrix.size }} [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
