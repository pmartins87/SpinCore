name: SpinCore lean functional benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean_functional_benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spincore-lean-functional-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          python -m pip install numpy==2.3.5

      - name: Build solver
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2 --target spincore_solver_c

      - name: 200-root realistic benchmark
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          SPINCORE_TORCH_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          rm -rf runs/lean_functional_benchmark
          /usr/bin/time -v python tools/run_lean_functional_training.py \
            --solver build/libspincore_solver_c.so \
            --seed 20260915 \
            --iterations 1 \
            --roots-per-iteration 200 \
            --exact-opponent-levels 0 \
            --advantage-steps 50 \
            --policy-steps 50 \
            --batch-size 256 \
            --checkpoint runs/lean_functional_benchmark/checkpoint.pt \
            --report runs/lean_functional_benchmark/report.json
          echo '--- compact report ---'
          cat runs/lean_functional_benchmark/report.json
