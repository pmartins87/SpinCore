name: SpinCore R7.4 SPINRULESET-4 HU invariance

on:
  workflow_run:
    workflows:
      - 'SpinCore R7.3 certify selected winner through 640'
      - 'SpinCore R7.3 source-exact recertification repair'
      - 'SpinCore R7.3 provisional 640 strategy bridge'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spincore-r7-4-ruleset4-hu-invariance
  cancel-in-progress: false

jobs:
  invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve strict or provisional R7.3 640 prerequisite
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import r7_3_certification_evidence as resolver
          import run_r7_4_domain_preflight as preflight

          freeze=json.load(open('validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json'))
          accepted=False
          origin=None
          strict_error=None
          try:
              acceptance, origin=resolver.resolve_valid_json(
                  'validation/R7_3_FROZEN_CANDIDATE_640_ACCEPTANCE.json',
                  validator=lambda d: preflight._validate_r7_3_prerequisites(freeze,d),
                  repo_root='.',
              )
          except Exception as exc:
              strict_error=repr(exc)
          else:
              assert acceptance['r7_3_640_acceptance_pass'] is True
              assert acceptance['r7_3_ready_to_advance_to_r7_4'] is True
              accepted=True
              mode='STRICT_EXACT_CERTIFICATION'

          if not accepted:
              p=Path('validation/R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE.json')
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
                  assert d['schema']=='SPINCORE_R7_3_PROVISIONAL_640_STRATEGY_ACCEPTANCE_V1'
                  assert d['source_head_sha']==freeze['source_head_sha']
                  assert d['durability_evidence_commit_sha']==freeze['evidence_commit_sha']
                  assert d['durability_evidence_sha256']==freeze['evidence_sha256']
                  assert d['behavior_semantic_id']==freeze['behavior_semantic_id']
                  assert d['thread_environment_contract']==freeze['thread_environment_contract']
                  assert d['thread_environment_overrides_injected_by_bridge'] is False
                  assert d['iterations']==5
                  assert d['roots_per_iteration']==128
                  assert d['roots_per_seed']==640
                  assert d['exact_opponent_levels']==2
                  assert d['per_seed_fit_pass'] is True
                  assert d['frozen_cross_seed_gates_pass'] is True
                  assert d['structural_contract_pass'] is True
                  assert d['strategic_acceptance_gate_changed'] is False
                  assert d['r7_3_strategy_quality_640_pass'] is True
                  assert d['r7_4_provisional_advance_allowed'] is True
                  assert d['certification_sequence_exception'] is True
                  assert d['exact_reproducibility_must_close_before_ready_for_tables'] is True
                  assert d['r7_3_fully_certified'] is False
                  assert d['ready_for_tables'] is False
              except Exception as exc:
                  print('Strict R7.3 prerequisite unavailable:', strict_error)
                  print('Provisional R7.3 strategy prerequisite unavailable:', repr(exc))
              else:
                  accepted=True
                  mode='PROVISIONAL_640_STRATEGY_QUALITY'
                  origin={
                      'path': str(p),
                      'mode': mode,
                      'exact_reproducibility_deferred': bool(d.get('exact_reproducibility_deferred')),
                      'release_debt_must_close': True,
                  }

          if accepted:
              json.dump(origin,open('/tmp/r7_3_acceptance_origin.json','w'),indent=2,sort_keys=True)
              Path('/tmp/r7_4_gate.txt').write_text('true',encoding='utf-8')
              Path('/tmp/r7_3_prerequisite_mode.txt').write_text(mode,encoding='utf-8')
              print('R7.4 prerequisite accepted in mode:', mode)
          else:
              Path('/tmp/r7_4_gate.txt').write_text('false',encoding='utf-8')
          PY
          echo "run=$(cat /tmp/r7_4_gate.txt)" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
      - name: Physical selected-HU invariance on frozen SPINRULESET-4 source
        if: steps.gate.outputs.run == 'true'
        id: physical
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_r7_4_hu_ruleset_invariance.py \
            --r7-freeze validation/R7_3_CANDIDATE_SEMANTIC_FREEZE.json \
            --ruleset-freeze validation/R7_4_RULESET_EXTENSION_FREEZE.json \
            --fresh-out validation/R7_4_RULESET4_HU_EVIDENCE.json \
            --report validation/R7_4_HU_INVARIANCE.json
      - name: Materialize ruleset acceptance
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f validation/R7_4_HU_INVARIANCE.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('validation/R7_4_HU_INVARIANCE.json'))
          f=json.load(open('validation/R7_4_RULESET_EXTENSION_FREEZE.json'))
          mode=Path('/tmp/r7_3_prerequisite_mode.txt').read_text(encoding='utf-8').strip()
          passed=r.get('selected_r7_3_hu_evidence_invariant') is True and r.get('difference_count')==0
          out={
            'schema':'SPINCORE_R7_4_RULESET_ACCEPTANCE_V1',
            'ruleset_schema':'SPINRULESET-4',
            'base_r7_3_source_head_sha':f['base_r7_3_source_head_sha'],
            'base_r7_3_evidence_commit_sha':f['base_r7_3_evidence_commit_sha'],
            'base_r7_3_evidence_sha256':f['base_r7_3_evidence_sha256'],
            'ruleset_extension_source_head_sha':f['ruleset_extension_source_head_sha'],
            'semantic_extension':f['semantic_extension'],
            'r7_3_prerequisite_mode':mode,
            'r7_3_exact_reproducibility_debt_preserved': mode=='PROVISIONAL_640_STRATEGY_QUALITY',
            'selected_training_components_byte_identical':bool(r.get('selected_training_components_byte_identical')),
            'hu_invariance_difference_count':int(r.get('difference_count',-1)),
            'hu_invariance_pass':passed,
            'r7_4_rules_source_accepted':passed,
            'r7_4_gate_changed':False,
            'ready_for_tables':False,
          }
          open('validation/R7_4_RULESET_ACCEPTANCE.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          else
            echo '{"schema":"SPINCORE_R7_4_RULESET_ACCEPTANCE_V1","runner_failed_before_report":true,"hu_invariance_pass":false,"r7_4_rules_source_accepted":false,"ready_for_tables":false}' > validation/R7_4_RULESET_ACCEPTANCE.json
          fi
      - name: Persist R7.4 ruleset evidence
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          for f in validation/R7_4_HU_INVARIANCE.json validation/R7_4_RULESET4_HU_EVIDENCE.json validation/R7_4_RULESET_ACCEPTANCE.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record SPINRULESET-4 HU invariance and acceptance [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Enforce R7.4 ruleset gate
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('validation/R7_4_HU_INVARIANCE.json'))
          a=json.load(open('validation/R7_4_RULESET_ACCEPTANCE.json'))
          assert r['selected_r7_3_hu_evidence_invariant'] is True, r
          assert r['difference_count']==0
          assert a['hu_invariance_pass'] is True, a
          assert a['r7_4_rules_source_accepted'] is True
          assert a['r7_4_gate_changed'] is False
          assert a['ready_for_tables'] is False
          print('SPINRULESET-4 HU invariance PASS; frozen rules source may enter R7.4 preflight.')
          PY
