name: SpinCore DeepCrusher DC0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepcrusher_dc0.yml'
      - 'python/spincore/openppl_expr.py'
      - 'python/spincore/openppl_program.py'
      - 'fixtures/openppl_library_dc0/**'
      - 'python/spincore/deepcrusher_r8_dc0.py'
      - 'python/spincore/deepcrusher_openppl.py'
      - 'python/spincore/deepcrusher_state.py'
      - 'python/spincore/deepcrusher_native_symbols.py'
      - 'python/spincore/deepcrusher_card_symbols.py'
      - 'python/spincore/deepcrusher_table_symbols.py'
      - 'python/spincore/deepcrusher_history_symbols.py'
      - 'python/spincore/deepcrusher_preflop_equity.py'
      - 'python/spincore/deepcrusher_benchmark.py'
      - 'python/spincore/deepcrusher_action.py'
      - 'python/spincore/deepcrusher_policy.py'
      - 'python/spincore/decision_sanity.py'
      - 'python_tests/test_openppl_expr.py'
      - 'python_tests/test_openppl_program.py'
      - 'python_tests/test_openppl_library_overlay.py'
      - 'python_tests/test_deepcrusher_*.py'
      - 'tools/audit_deepcrusher_r8_dc0_readiness.py'
      - 'tools/audit_deepcrusher_r8_openppl_compile.py'
      - 'tools/audit_deepcrusher_r8_native_coverage.py'
      - 'tools/audit_deepcrusher_r8_library_overlay.py'
      - 'tools/audit_deepcrusher_r8_transitive_native_closure.py'
      - 'tools/audit_benchmark_decisions.py'
      - 'tools/evaluate_deepcrusher_dc1.py'
      - 'tools/smoke_deepcrusher_oracle_solver.py'
      - 'tools/generate_deepcrusher_openholdem_testsuite.py'
      - 'include/spincore/solver_c_api.h'
      - 'src/solver_c_api.cpp'
      - 'CMakeLists.txt'
      - 'fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt'
      - 'fixtures/deepcrusher_r8_v22/preflop_range_equity_class_v1.tsv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spincore-deepcrusher-dc0
  cancel-in-progress: true

jobs:
  dc0-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install pytest
      - name: Compile DC0 Python
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m py_compile \
            python/spincore/openppl_expr.py \
            python/spincore/openppl_program.py \
            python/spincore/deepcrusher_r8_dc0.py \
            python/spincore/deepcrusher_openppl.py \
            python/spincore/deepcrusher_state.py \
            python/spincore/deepcrusher_native_symbols.py \
            python/spincore/deepcrusher_card_symbols.py \
            python/spincore/deepcrusher_table_symbols.py \
            python/spincore/deepcrusher_history_symbols.py \
            python/spincore/deepcrusher_preflop_equity.py \
            python/spincore/deepcrusher_benchmark.py \
            python/spincore/deepcrusher_action.py \
            python/spincore/deepcrusher_policy.py \
            python/spincore/decision_sanity.py \
            tools/audit_deepcrusher_r8_dc0_readiness.py \
            tools/audit_deepcrusher_r8_openppl_compile.py \
            tools/audit_deepcrusher_r8_native_coverage.py \
            tools/audit_deepcrusher_r8_library_overlay.py \
            tools/audit_deepcrusher_r8_transitive_native_closure.py \
            tools/audit_benchmark_decisions.py \
            tools/evaluate_deepcrusher_dc1.py \
            tools/smoke_deepcrusher_oracle_solver.py \
            tools/generate_deepcrusher_openholdem_testsuite.py
      - name: Expression semantics
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python python_tests/test_openppl_expr.py
      - name: Ordered WHEN program semantics
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python python_tests/test_openppl_program.py
          python -m pytest -q python_tests/test_openppl_library_overlay.py
      - name: Existing DeepCrusher contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m pytest -q \
            python_tests/test_deepcrusher_openppl_inventory.py \
            python_tests/test_deepcrusher_benchmark_contract.py \
            python_tests/test_deepcrusher_native_symbols.py \
            python_tests/test_deepcrusher_card_symbols.py \
            python_tests/test_deepcrusher_table_symbols.py \
            python_tests/test_deepcrusher_history_symbols.py \
            python_tests/test_deepcrusher_preflop_equity.py \
            python_tests/test_deepcrusher_action.py \
            python_tests/test_deepcrusher_policy.py \
            python_tests/test_decision_sanity.py
      - name: Full frozen R8 source compile gate
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python tools/preflight_deepcrusher_benchmark.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --json /tmp/deepcrusher_preflight.json
          python tools/audit_deepcrusher_r8_openppl_compile.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --report /tmp/deepcrusher_openppl_compile.json
          cat /tmp/deepcrusher_openppl_compile.json
      - name: Native symbol coverage report
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python tools/audit_deepcrusher_r8_native_coverage.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --report /tmp/deepcrusher_native_coverage.json
          cat /tmp/deepcrusher_native_coverage.json
          python tools/audit_deepcrusher_r8_library_overlay.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --library fixtures/openppl_library_dc0/OpenPPL_Library_part1.ohf \
            --library fixtures/openppl_library_dc0/OpenPPL_Library_part2.ohf \
            --report /tmp/deepcrusher_library_overlay.json
          cat /tmp/deepcrusher_library_overlay.json
          python tools/audit_deepcrusher_r8_transitive_native_closure.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --library fixtures/openppl_library_dc0/OpenPPL_Library_part1.ohf \
            --library fixtures/openppl_library_dc0/OpenPPL_Library_part2.ohf \
            --report /tmp/deepcrusher_transitive_native_closure.json
          cat /tmp/deepcrusher_transitive_native_closure.json
      - name: Observable state contract syntax
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python -m py_compile python_tests/test_deepcrusher_state_view.py

      - name: Build exact-action solver for oracle smoke
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2 --target spincore_solver_c

      - name: End-to-end DeepCrusher oracle runtime smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python tools/smoke_deepcrusher_oracle_solver.py \
            --solver build/libspincore_solver_c.so \
            --report /tmp/deepcrusher_oracle_runtime_smoke.json
          cat /tmp/deepcrusher_oracle_runtime_smoke.json

      - name: Generate OpenHoldem parity pack smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python tools/generate_deepcrusher_openholdem_testsuite.py \
            --solver build/libspincore_solver_c.so \
            --output-dir /tmp/deepcrusher_openholdem_parity \
            --cases-per-domain 1 \
            --max-search 250
          cat /tmp/deepcrusher_openholdem_parity/manifest.json
          cat /tmp/deepcrusher_openholdem_parity/deepcrusher_dc0_parity.tc
          for f in /tmp/deepcrusher_openholdem_parity/dc0_*.txt; do
            echo "=== PARITY_CASE_BEGIN:$(basename "$f") ==="
            cat "$f"
            echo "=== PARITY_CASE_END:$(basename "$f") ==="
          done
          for f in fixtures/deepcrusher_openholdem_parity_v1/dc0_*.txt; do
            diff -u "$f" "/tmp/deepcrusher_openholdem_parity/$(basename "$f")"
          done
          diff -u \
            fixtures/deepcrusher_openholdem_parity_v1/deepcrusher_dc0_parity.tc \
            /tmp/deepcrusher_openholdem_parity/deepcrusher_dc0_parity.tc
          echo "DEEPC_RUSHER_OPENHOLDEM_PARITY_FIXTURES_FROZEN_PASS"
