name: SpinCore DeepCrusher DC0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepcrusher_dc0.yml'
      - 'python/spincore/openppl_expr.py'
      - 'python/spincore/openppl_program.py'
      - 'fixtures/openppl_library_dc0/**'
      - 'python/spincore/deepcrusher_r8_dc0.py'
      - 'python/spincore/deepcrusher_openppl.py'
      - 'python/spincore/deepcrusher_state.py'
      - 'python/spincore/deepcrusher_native_symbols.py'
      - 'python/spincore/deepcrusher_benchmark.py'
      - 'python/spincore/decision_sanity.py'
      - 'python_tests/test_openppl_expr.py'
      - 'python_tests/test_openppl_program.py'
      - 'python_tests/test_openppl_library_overlay.py'
      - 'python_tests/test_deepcrusher_*.py'
      - 'tools/audit_deepcrusher_r8_dc0_readiness.py'
      - 'tools/audit_deepcrusher_r8_openppl_compile.py'
      - 'tools/audit_deepcrusher_r8_native_coverage.py'
      - 'tools/audit_deepcrusher_r8_library_overlay.py'
      - 'tools/audit_benchmark_decisions.py'
      - 'fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spincore-deepcrusher-dc0
  cancel-in-progress: true

jobs:
  dc0-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install pytest
      - name: Compile DC0 Python
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m py_compile \
            python/spincore/openppl_expr.py \
            python/spincore/openppl_program.py \
            python/spincore/deepcrusher_r8_dc0.py \
            python/spincore/deepcrusher_openppl.py \
            python/spincore/deepcrusher_state.py \
            python/spincore/deepcrusher_native_symbols.py \
            python/spincore/deepcrusher_benchmark.py \
            python/spincore/decision_sanity.py \
            tools/audit_deepcrusher_r8_dc0_readiness.py \
            tools/audit_deepcrusher_r8_openppl_compile.py \
            tools/audit_deepcrusher_r8_native_coverage.py \
            tools/audit_deepcrusher_r8_library_overlay.py \
            tools/audit_benchmark_decisions.py
      - name: Expression semantics
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python python_tests/test_openppl_expr.py
      - name: Ordered WHEN program semantics
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python python_tests/test_openppl_program.py
          python -m pytest -q python_tests/test_openppl_library_overlay.py
      - name: Existing DeepCrusher contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m pytest -q \
            python_tests/test_deepcrusher_openppl_inventory.py \
            python_tests/test_deepcrusher_benchmark_contract.py \
            python_tests/test_deepcrusher_native_symbols.py \
            python_tests/test_decision_sanity.py
      - name: Full frozen R8 source compile gate
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python tools/preflight_deepcrusher_benchmark.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --json /tmp/deepcrusher_preflight.json
          python tools/audit_deepcrusher_r8_openppl_compile.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --report /tmp/deepcrusher_openppl_compile.json
          cat /tmp/deepcrusher_openppl_compile.json
      - name: Native symbol coverage report
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python tools/audit_deepcrusher_r8_native_coverage.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --report /tmp/deepcrusher_native_coverage.json
          cat /tmp/deepcrusher_native_coverage.json
          python tools/audit_deepcrusher_r8_library_overlay.py \
            --deepcrusher-source fixtures/deepcrusher_r8_v22/DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt \
            --library fixtures/openppl_library_dc0/OpenPPL_Library_part1.ohf \
            --library fixtures/openppl_library_dc0/OpenPPL_Library_part2.ohf \
            --report /tmp/deepcrusher_library_overlay.json
          cat /tmp/deepcrusher_library_overlay.json
      - name: Observable state contract syntax
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python -m py_compile python_tests/test_deepcrusher_state_view.py
