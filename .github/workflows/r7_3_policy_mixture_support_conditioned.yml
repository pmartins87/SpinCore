name: SpinCore R7.3 policy-mixture support conditioned

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_policy_mixture_support_conditioned.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests
      - name: Smoke support-conditioned forensic
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_policy_mixture_support_conditioned.py \
            --solver build/libspincore_solver_c.so \
            --out /tmp/R7_3_POLICY_MIX_SUPPORT_SMOKE.json \
            --ensemble-size 4 --iterations 2 --roots-per-iteration 1 \
            --advantage-chunk-steps 8 --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 --policy-chunk-steps 8 --policy-max-steps 8 \
            --policy-fit-target 10 --batch-size 16 --audit-size 32 \
            --cross-seed-per-seed 16 --reservoir-capacity 5000
          python - <<'PY'
          import json
          d=json.load(open('/tmp/R7_3_POLICY_MIX_SUPPORT_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_POLICY_MIXTURE_SUPPORT_CONDITIONED_V1'
          assert d['advantage_policy_mixture_size']==4
          assert 'shared_exact_canonical' in d['cross_seed_by_support']
          assert 'support_A_unique_exact' in d['cross_seed_by_support']
          assert d['production_semantics_changed'] is False
          assert d['ready_for_tables'] is False
          print('policy-mixture support-conditioned smoke OK')
          PY
      - name: Run physical 256-root support-conditioned forensic
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_policy_mixture_support_conditioned.py \
            --solver build/libspincore_solver_c.so \
            --out validation/R7_3_POLICY_MIXTURE_SUPPORT_CONDITIONED_256.json \
            --ensemble-size 4 --exact-opponent-levels 2 \
            --iterations 2 --roots-per-iteration 128 \
            --advantage-chunk-steps 256 --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 --policy-chunk-steps 256 --policy-max-steps 16384 \
            --policy-fit-target 0.105 --batch-size 256 --audit-size 512 \
            --cross-seed-per-seed 1024 --reservoir-capacity 100000
      - name: Persist support-conditioned evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=validation/R7_3_POLICY_MIXTURE_SUPPORT_CONDITIONED_256.json
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_POLICY_MIXTURE_SUPPORT_CONDITIONED_V1","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record R7.3 policy-mixture support-conditioned forensic [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
