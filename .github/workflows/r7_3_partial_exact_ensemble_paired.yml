name: SpinCore R7.3 paired partial-exact ensemble

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_partial_exact_ensemble_paired.yml'
      - 'tools/run_r7_3_partial_exact_ensemble_paired.py'
      - 'tools/run_r7_3_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        ensemble_size: [1, 2, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Smoke paired partial-exact ensemble runner
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          size='${{ matrix.ensemble_size }}'
          python tools/run_r7_3_partial_exact_ensemble_paired.py \
            --solver build/libspincore_solver_c.so \
            --out "/tmp/R7_3_PARTIAL_EXACT_ENSEMBLE_PAIRED_SIZE${size}_SMOKE.json" \
            --ensemble-size "$size" \
            --exact-opponent-levels 2 \
            --iterations 2 \
            --roots-per-iteration 2 \
            --advantage-chunk-steps 8 \
            --advantage-max-steps-per-iteration 8 \
            --advantage-fit-target 10 \
            --policy-chunk-steps 8 \
            --policy-max-steps 8 \
            --policy-fit-target 10 \
            --batch-size 16 \
            --audit-size 32 \
            --cross-seed-per-seed 16 \
            --reservoir-capacity 5000
          python - "$size" <<'PY'
          import json,sys
          size=int(sys.argv[1])
          d=json.load(open(f'/tmp/R7_3_PARTIAL_EXACT_ENSEMBLE_PAIRED_SIZE{size}_SMOKE.json'))
          assert d['schema']=='SPINCORE_R7_3_PARTIAL_EXACT_ENSEMBLE_PAIRED_V1'
          assert d['ensemble_size']==size
          assert d['deck_formula']=='seed*1000003 + global_root*97 + iteration'
          assert d['rng_contract']=='RECOVERED_SINGLE_COUPLED_BATCH_RNG_PRIMARY_MEMBER'
          assert d['extra_members_perturb_primary_rng'] is False
          assert d['ready_for_tables'] is False
          for seed in d['per_seed']:
              for cp in seed['checkpoints']:
                  assert cp['members'][0]['role']=='PRIMARY_AUTHORITATIVE_COUPLED_RNG'
                  assert all(m['role']=='SIDE_MEMBER_DOES_NOT_PERTURB_PRIMARY_RNG' for m in cp['members'][1:])
          print('paired partial-exact ensemble smoke OK')
          PY

      - name: Run physical paired 256-root candidate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          size='${{ matrix.ensemble_size }}'
          python tools/run_r7_3_partial_exact_ensemble_paired.py \
            --solver build/libspincore_solver_c.so \
            --out "validation/R7_3_PARTIAL_EXACT_ENSEMBLE_PAIRED_SIZE${size}_256.json" \
            --ensemble-size "$size" \
            --exact-opponent-levels 2 \
            --iterations 2 \
            --roots-per-iteration 128 \
            --advantage-chunk-steps 256 \
            --advantage-max-steps-per-iteration 4096 \
            --advantage-fit-target 0.50 \
            --policy-chunk-steps 256 \
            --policy-max-steps 16384 \
            --policy-fit-target 0.105 \
            --batch-size 256 \
            --audit-size 512 \
            --cross-seed-per-seed 1024 \
            --reservoir-capacity 100000

      - name: Persist paired candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          size='${{ matrix.ensemble_size }}'
          out="validation/R7_3_PARTIAL_EXACT_ENSEMBLE_PAIRED_SIZE${size}_256.json"
          if [ ! -f "$out" ]; then
            echo "{\"schema\":\"SPINCORE_R7_3_PARTIAL_EXACT_ENSEMBLE_PAIRED_V1\",\"ensemble_size\":${size},\"runner_failed_before_report\":true,\"ready_for_tables\":false}" > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m "Record paired R7.3 partial-exact ensemble size ${size} [r7-evidence-skip]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
