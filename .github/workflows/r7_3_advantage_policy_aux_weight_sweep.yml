name: SpinCore R7.3 Advantage policy-aux weight sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r7_3_advantage_policy_aux_weight_sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weight:
    strategy:
      fail-fast: false
      matrix:
        include:
          - weight: '0.025'
            tag: '0025'
            out: validation/R7_3_ADV_POLICY_AUX_W0025_256.json
          - weight: '0.05'
            tag: '005'
            out: validation/R7_3_ADV_POLICY_AUX_W005_256.json
          - weight: '0.10'
            tag: '010'
            out: validation/R7_3_ADV_POLICY_AUX_W010_256.json
          - weight: '0.15'
            tag: '015'
            out: validation/R7_3_ADV_POLICY_AUX_W015_256.json
    name: w_${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest

      - name: Build and regress authoritative solver
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          pytest -q python_tests

      - name: Run physical same-memory policy-aux weight
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          python tools/run_r7_3_advantage_objective_stability.py \
            --solver build/libspincore_solver_c.so \
            --out '${{ matrix.out }}' \
            --objective mse_policy \
            --aux-weight '${{ matrix.weight }}' \
            --roots 256 \
            --reservoir-capacity 100000 \
            --chunk-steps 256 \
            --max-steps 4096 \
            --fit-target 0.50 \
            --batch-size 256 \
            --audit-size 1024 \
            --eval-size 2048

      - name: Persist weight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out='${{ matrix.out }}'
          if [ ! -f "$out" ]; then
            echo '{"schema":"SPINCORE_R7_3_ADVANTAGE_OBJECTIVE_STABILITY_V1","runner_failed_before_report":true,"ready_for_tables":false}' > "$out"
          fi
          git config user.name 'SpinCore R7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record physical R7.3 Advantage policy-aux weight ${{ matrix.weight }} [r7-evidence-skip]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
