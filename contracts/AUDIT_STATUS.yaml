known_reconciliation_items:
  - id: RECON-001
    status: RESOLVED
    topic: utility_scope
    resolution: GAME-013
    detail: >
      The apparent conflict is lane-scoped rather than a supersession. Lean WTA
      training retains chip delta /1500, while an explicit multi-place payout
      production Deep-CFR lane retains payout-aware ICM continuation utility.
      The scoped rule is now explicit in GAME-013.
  - id: RECON-002
    status: RESOLVED
    topic: representation_lineage
    resolution: REP-015,REP-016,REP-017
    detail: >
      Representation identity is now explicitly role-scoped. SPNNIV1 remains
      the current lean LT2/LT3 policy input; SPNNIV3 remains valid as a
      diagnostic/oracle carrier and historical R7.5 candidate lineage but is
      not an implicit policy-input or production winner.
  - id: RECON-003
    status: RESOLVED
    topic: action_abstraction_lineage
    resolution: ACT-012,ACT-013
    detail: >
      The active LT2/LT3 action abstraction is the legacy-derived seven-action
      vocabulary in the ten-slot carrier. Historical R7.5 A/B/C and 10/20
      ablations remain localized experimental evidence and cannot supersede the
      current contract without a representative full-distribution decision.
  - id: RECON-004
    status: OPEN
    topic: current_semantic_long_performance_regression
    detail: >
      The active 10115->10315 semantic long fitter is sequential despite the
      mandatory performance policy and prior exact-parity concurrent-ensemble
      precedent. The running experiment is scientifically grandfathered, but
      future execution requires a parity-validated optimized semantic fitter.

