schema: SPINCORE_CONTRACT_MODULE_V1
module_id: PERF
status: PARTIAL_AUDIT
invariants:
  - id: PERF-010
    status: ACTIVE
    scope: RYZEN_HEAVY_COMPUTE
    statement: The user's 32-logical-thread Ryzen is the primary heavy-compute host and substantial workloads must be designed and measured for that hardware.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-011
    status: ACTIVE
    scope: RYZEN_HEAVY_COMPUTE
    statement: Independent CPU-bound work should use process parallelism when semantics are unchanged, normally one Torch/OpenMP/BLAS thread per worker; avoid oversubscription.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-012
    status: ACTIVE
    scope: ITERATIVE_HEAVY_COMPUTE
    statement: Persistent pools should amortize process spawn/model-load overhead across iterations when practical.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-013
    status: ACTIVE
    scope: OPTIMIZATION_SELECTION
    statement: CPU utilization is diagnostic, not the objective; select by useful end-to-end throughput, memory safety, stability, and semantic parity.
    provenance:
      - AGENTS.md
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-014
    status: ACTIVE
    scope: EXECUTION_ARCHITECTURE_CHANGE
    statement: Re-benchmark the actual Ryzen when the relevant execution architecture materially changes and persist the selected profile.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-015
    status: ACTIVE
    scope: ACTIVE_SERIAL_RUN_MIGRATION
    statement: When introducing an optimization into an active serial long run, stop only after a durable checkpoint when practical and resume from that checkpoint after parity is established.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
  - id: PERF-016
    status: ACTIVE
    scope: ENS8_OR_OTHER_INDEPENDENT_MEMBER_FITS
    statement: Sequential member fitting is not an acceptable final long-run execution path when a parity-preserving concurrent implementation yields material speedup.
    provenance:
      - ROADMAP.md
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-017
    status: ACTIVE
    scope: KNOWN_LT3_ENS8_IMPLEMENTATION
    statement: The validated LT3 ENS8 execution precedent is four concurrent processes with eight Torch threads per member and exact parity; this is a precedent, not a blind requirement for different model shapes.
    provenance:
      - ROADMAP.md
      - tools/lt3_hu_ens8_parallel_fit.py

  - id: PERF-018
    status: ACTIVE
    scope: RYZEN_OPTIMIZATION
    statement: Once one phase is accelerated, profile the resulting end-to-end workload and optimize the new dominant bottleneck specifically rather than continuing to scale a phase that is no longer limiting.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-019
    status: ACTIVE
    scope: TARGET_HOST_PROFILE
    statement: The selected worker/thread profile and benchmark evidence must be persisted so later sessions and resume scripts do not silently revert to an unmeasured execution profile.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: PERF-020
    status: ACTIVE
    scope: PERFORMANCE_OPTIMIZATION
    statement: A throughput optimization may change scheduling and implementation mechanics only; if it materially approximates or changes game semantics, sampling distribution, objective, representation, action semantics, or intended learning algorithm, it is an architecture decision and requires separate strategic adjudication.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: PERF-021
    status: ACTIVE
    scope: PARALLEL_ROOT_COLLECTION
    statement: When root collection is process-parallel, the parent remains authoritative for scenario sampling and reservoir insertion, workers use independent deterministic root streams, and returned samples are merged in deterministic root order so worker scheduling does not redefine training semantics.
    provenance:
      - docs/RYZEN_OPTIMIZATION_POLICY.md
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_parallel.py

  - id: PERF-022
    status: ACTIVE
    scope: SEMANTIC_LONG_10115_10315_TRANSITION
    statement: >
      The already-running sequential 10115->10315 semantic long process is a
      grandfathered scientific execution and may finish untouched. Its low CPU
      utilization is a recorded performance regression, not grounds to alter the
      live run. If that process terminates before success, or if the lane is
      extended/restarted later, the sequential fitter is not reusable until an
      optimized semantic-member fitter proves output/seed semantics parity and
      a measured target-Ryzen throughput profile is frozen.
    provenance:
      - contracts/run_manifests/semantic_long_10115_10315_active.json
      - docs/RYZEN_OPTIMIZATION_POLICY.md
      - ROADMAP.md

  - id: PERF-023
    status: ACTIVE
    scope: COMPUTE_PLACEMENT
    statement: >
      GitHub Actions is primarily the contract referee for CI, short
      deterministic regression, independent certification, and durable evidence;
      the user's Ryzen is preferred for multi-hour traversal/training and large
      multi-seed CPU workloads. Compute placement may change execution mechanics
      but not strategic thresholds or experiment semantics.
    provenance:
      - validation/R7_5_FINITE_CLOSURE_AND_COMPUTE_POLICY_20260816.md
      - docs/RYZEN_OPTIMIZATION_POLICY.md
