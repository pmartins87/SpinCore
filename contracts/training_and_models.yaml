schema: SPINCORE_CONTRACT_MODULE_V1
module_id: TRAIN_MODEL
status: COMPLETE
invariants:
  - id: TRAIN-001
    status: ACTIVE
    scope: LEAN_DEEP_CFR
    statement: Training uses external-sampling Deep CFR; traverser nodes evaluate all legal branches and opponent nodes sample one action from current behavior.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
  - id: TRAIN-002
    status: ACTIVE
    scope: LEAN_DEEP_CFR
    statement: Advantage samples enter a uniform reservoir; AveragePolicy samples come from independent ordinary sampled trajectories using the current behavior distribution.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - README.md
  - id: TRAIN-003
    status: ACTIVE
    scope: LEAN_BEHAVIOR
    statement: Positive predicted advantages are regret-matched; when all legal predicted advantages are non-positive, behavior uses stable masked softmax over raw advantages rather than uniform fallback.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - CURRENT_WORK.md
  - id: MODEL-001
    status: ACTIVE
    scope: DOMAIN_SEPARATION
    statement: Advantage and AveragePolicy are separate models and 3H/HU are maintained as separate policy families.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
  - id: TRAIN-020
    status: ACTIVE
    scope: SEMANTIC_LONG_10115_10315
    statement: The active long lane trains THREE_HANDED semantic Advantage only from semantic iteration 10115 to 10315, 200 iterations, 64 roots per iteration, with HU frozen at 10105 and no AveragePolicy training during the long phase.
    provenance:
      - ROADMAP.md
      - tools/run_3h_semantic_long_10115_10315.py
  - id: MODEL-020
    status: ACTIVE
    scope: SEMANTIC_LONG_10115_10315
    statement: The semantic Advantage teacher uses eight members, each fresh-fit for 1600 steps per online iteration with the frozen deterministic member seed contract.
    provenance:
      - ROADMAP.md
      - tools/run_3h_semantic_long_10115_10315.py
  - id: TRAIN-021
    status: ACTIVE
    scope: POST_10315
    statement: After successful 10315 completion, AveragePolicy targets must be freshly rebuilt from the final teacher; historical AveragePolicy continuation is not used.
    provenance:
      - ROADMAP.md
      - tools/run_3h_semantic_long_10115_10315.py
  - id: MODEL-021
    status: ACTIVE
    scope: POST_10315_SPECIALIST
    statement: The validated strong-hand specialist architecture is rebuilt without new post-hoc model selection; route is postflop made-category at least trips with Fold legal, using STRATIFIED low/mid/high teacher-Fold sampling and fixed 25 steps.
    provenance:
      - CURRENT_WORK.md
      - tools/build_3h_semantic_stratified_specialist_10315.py

  - id: TRAIN-004
    status: ACTIVE
    scope: EXTERNAL_SAMPLING_ADVANTAGE_TARGETS
    statement: At a traverser node, every effective legal action branch is evaluated and the stored advantage target is action value minus the current-policy node value; at ordinary opponent nodes external sampling follows the current behavior unless an explicitly declared partial-exact diagnostic level is active.
    provenance:
      - README.md
      - python/spincore/deep_cfr.py
      - python/spincore/r7_5_action_cfr.py
  - id: TRAIN-005
    status: ACTIVE
    scope: LEAN_FUNCTIONAL_AVERAGE_POLICY
    statement: The current lean functional path collects AveragePolicy targets on independent ordinary sampled game trajectories, storing the current behavior distribution at each encountered decision and sampling one action to continue.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_functional_training.py
  - id: TRAIN-006
    status: ACTIVE
    scope: R7_OWN_REACH_AVERAGE_POLICY_CAPABILITY
    statement: >
      The preserved R7 action-CFR path retains own-reach AveragePolicy collection
      semantics: target-player decisions are recorded under current behavior while
      non-target actors are expanded across legal actions. This capability must
      not be silently redefined when an R7-derived lane depends on it.
    provenance:
      - README.md
      - python/spincore/deep_cfr.py
      - python/spincore/r7.py
      - python/spincore/r7_5_action_cfr.py
  - id: TRAIN-007
    status: ACTIVE
    scope: LEAN_ADVANTAGE_FIT
    statement: A fresh Advantage approximator is reinitialized for a declared CFR fit cycle without clearing accumulated training memories; between reset and completed fit the model is not treated as a valid regret approximator.
    provenance:
      - python/spincore/deep_cfr.py
      - python/spincore/lean_functional_training.py
  - id: MODEL-002
    status: ACTIVE
    scope: UNTRAINED_BEHAVIOR
    statement: The true zero-regret untrained bootstrap behavior is uniform over effective legal actions; the raw-advantage softmax fallback applies only after a fitted Advantage model exists.
    provenance:
      - python/spincore/deep_cfr.py

  - id: TRAIN-008
    status: ACTIVE
    scope: LEAN_FUNCTIONAL_BASELINE
    statement: Ordinary lean external-sampling training uses exact_opponent_levels equal to zero unless a separately declared bounded diagnostic or successor contract explicitly changes it.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_functional_training.py
  - id: TRAIN-009
    status: ACTIVE
    scope: BASE_POLICY
    statement: The base learner is self-play and does not train against a fixed scripted opponent or embed an opponent-specific exploit model; exploit adaptation belongs to a later explicitly separated layer.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - docs/POKER_GOALS_AND_TRAINING_EXPLAINED.md
  - id: TRAIN-010
    status: ACTIVE
    scope: VALIDATED_LT2_LT3_LINEAGE
    statement: The accumulated validated learning state is preserved by default; a clean-from-zero restart is a separate expensive research arm, not an assumed repair, unless new evidence shows the retained state is invalid.
    provenance:
      - ROADMAP.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: TRAIN-011
    status: ACTIVE
    scope: TRAINING_DURATION
    statement: Additional roots or iterations are not themselves evidence of strategic improvement; continuation requires an explicit research/utilization rationale and later strategic evidence.
    provenance:
      - ROADMAP.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md

  - id: MODEL-022
    status: ACTIVE
    scope: POST_10315_AVERAGE_POLICY_REBUILD
    statement: The post-10315 rebuild uses 8000 fresh ordinary teacher episodes, 500 strategy optimizer steps, an independent 180000-episode augmentation stream for novel strong/Fold-legal states, and a separate 50000-episode evaluation stream; strong means postflop made-category at least trips with Fold legal.
    provenance:
      - tools/build_3h_semantic_postlong_policy_10315.py
  - id: MODEL-023
    status: ACTIVE
    scope: POST_10315_SPECIALIST_BUILD
    statement: The rebuilt specialist uses a fresh 300000-episode teacher pool, requires at least 1200 unique strong states including at least 30 high-target and 10 mid-target Fold states, starts from the rebuilt full-pool general model, uses the already-selected STRATIFIED mode, and trains exactly 25 steps without a new 10315 model-selection sweep.
    provenance:
      - tools/build_3h_semantic_stratified_specialist_10315.py

  - id: TRAIN-012
    status: ACTIVE
    scope: SEMANTIC_ADVANTAGE_BEHAVIOR_AND_TARGET_GENERATION
    statement: >
      Semantic Advantage ensemble behavior must use the canonical
      lean_regret_matching_policy mapping, including stable masked softmax over
      legal raw advantages when every legal averaged advantage is non-positive.
      A separate helper may not silently substitute uniform fallback.
    provenance:
      - ROADMAP.md
      - python/spincore/lean_action_policy.py
      - tools/run_3h_semantic_research_10105_10115.py
      - tools/run_3h_semantic_long_10115_10315.py
  - id: MODEL-024
    status: ACTIVE
    scope: ACCEPTED_3H_RESEARCH_ARCHITECTURE_AT_10115
    statement: >
      The accepted 10115 three-handed research architecture is the rebuilt
      full-pool semantic general AveragePolicy plus the unchanged
      target-stratified strong-hand specialist, with specialist training mode
      STRATIFIED and 25 optimizer steps. Failed pure-specialist,
      confidence-router, and Fold-logit-calibrated variants are historical
      evidence and are not silently promoted.
    provenance:
      - ROADMAP.md
      - tools/audit_3h_semantic_stratified_specialist_multiseed_10115.py
      - tools/run_deepcrusher_dc1_stratified_specialist_5k.sh

  - id: MODEL-030
    status: CONDITIONAL
    scope: FUTURE_OPPONENT_EXPLOITATION_IF_ENABLED
    statement: >
      Opponent-specific exploitation is an explicit overlay on an independently
      available audited baseline, never a replacement for it. Exploit identity
      binds strategic profile/domain/action schema, baseline policy, opponent
      identity/data cutoff, model/configuration, uncertainty method, and exploit
      policy identity.
    provenance:
      - validation/R11_SAFE_EXPLOITATION_GATE_DESIGN_20260812.md
  - id: MODEL-031
    status: CONDITIONAL
    scope: FUTURE_OPPONENT_EXPLOITATION_IF_ENABLED
    statement: >
      An exploit may activate only under a precommitted uncertainty/safety
      protocol with independent or held-out evidence. Unknown or ambiguous
      opponents, insufficient/stale/corrupt evidence, unsupported profile/domain,
      excessive uncertainty, or hash/schema mismatch fall back to the audited
      baseline or no-action safety barrier; they never borrow another player's
      exploit model.
    provenance:
      - validation/R11_SAFE_EXPLOITATION_GATE_DESIGN_20260812.md
  - id: MODEL-032
    status: CONDITIONAL
    scope: FUTURE_OPPONENT_EXPLOITATION_IF_ENABLED
    statement: >
      Exploitation may not alter the canonical encoder, legal-action mapping, or
      OpenHoldem translator, and in three-handed play it may not model the target
      opponent while assuming the third player's behavior is irrelevant.
      Opponent-model updates are versioned and auditable rather than invisible
      mutation of an approved exploit artifact.
    provenance:
      - validation/R11_SAFE_EXPLOITATION_GATE_DESIGN_20260812.md

  - id: TRAIN-022
    status: ACTIVE
    scope: SEMANTIC_LONG_10315_15315
    statement: >
      The next semantic-Advantage macroblock continues the frozen THREE_HANDED
      teacher from iteration 10315 to 15315: 5000 additional online iterations,
      64 roots per iteration, eight members, 1600 fit steps per member, canonical
      lean regret-matching with softmax fallback, frozen HU@10105, and no
      AveragePolicy or specialist training during the long phase. Safety/integrity
      milestones occur every 500 iterations; no comparative strength benchmark
      is run before 15315 unless a hard safety/integrity stop fires.
    provenance:
      - ROADMAP.md
      - CURRENT_WORK.md

  - id: TRAIN-023
    status: ACTIVE
    scope: ITERATION_COUNTER_SEMANTICS
    statement: >
      Absolute iteration labels across SpinCore phases are lineage identifiers,
      not homogeneous units of training progress. The frozen 10105 source belongs
      to the earlier base-training lineage; semantic online THREE_HANDED training
      begins at 10106. Therefore 10315 does not mean 10315 comparable semantic
      online iterations, and a later +5000 semantic macroblock must not be
      described as roughly 50 percent of all previous training. Within the
      homogeneous semantic-online phase, report both additional iterations and
      new roots, while keeping earlier base-training exposure separate.
    provenance:
      - CURRENT_WORK.md
      - ROADMAP.md

  - id: MODEL-025
    status: ACTIVE
    scope: POST_15315_MULTI_REBUILD_DEPLOYABLE_POLICY
    statement: >
      The primary deployable-policy candidate rebuilt from teacher 15315 is a
      uniform probability ensemble of eight independently rebuilt
      AveragePolicy/fullpool/specialist members under the frozen post-15315
      preregistration. Each member applies the same fullpool/specialist route
      before aggregation. Members may not be weighted, dropped, or selected by
      observed fit, pathology, or strength outcomes. If the preregistered K=8
      stability gate alone fails, exactly four already-seeded members may be
      added for K=12 before any external strength benchmark is inspected. A
      single representative or compressed policy is a separate future
      deployment experiment and does not inherit ensemble validation.
    provenance:
      - contracts/post15315_multirebuild_preregistration.json
      - ROADMAP.md
      - CURRENT_WORK.md
