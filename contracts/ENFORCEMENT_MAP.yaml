schema: SPINCORE_CONTRACT_ENFORCEMENT_MAP_V1
date: "2026-09-29"
purpose: >
  Record the primary enforcement path for every contract invariant. A mapping
  marked PARTIAL_AUTOMATION or REVIEW does not pretend that the poker/strategic
  statement is mechanically provable; it identifies the mandatory gate that
  must carry the invariant into implementation and evidence. Contract CI fails
  when an invariant exists without an enforcement binding.
