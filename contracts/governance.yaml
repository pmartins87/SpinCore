schema: SPINCORE_CONTRACT_MODULE_V1
module_id: GOV
status: COMPLETE
invariants:
  - id: GOV-010
    status: ACTIVE
    scope: GLOBAL
    statement: Before proposing or executing training, architecture, action-abstraction, sampler, evaluator/state, runtime integration, or heavy Ryzen work, read the active project contract and the repository sources it references.
    provenance:
      - AGENTS.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: GOV-011
    status: ACTIVE
    scope: GLOBAL
    statement: SpinCore is an evolution of the multi-year DeepSpin/SpinGo baseline, not a greenfield replacement; inspect the legacy implementation before replacing a component already addressed there.
    provenance:
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
      - README.md
  - id: GOV-012
    status: ACTIVE
    scope: STRATEGIC_OR_ARCHITECTURAL_CHANGE
    statement: A strategic or architectural change requires a concrete defect, limitation, new requirement, or evidence-based reason; a newer or cleaner implementation alone is insufficient.
    provenance:
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: GOV-013
    status: ACTIVE
    scope: HEAVY_COMPUTE
    statement: Do not start heavy compute before confirming game distribution, legal actions, hand evaluation, utility semantics, hidden/public state, and runtime action mapping for the intended game.
    provenance:
      - AGENTS.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: GOV-014
    status: ACTIVE
    scope: EXPENSIVE_EVIDENCE
    statement: Expensive tests must state which decision they can change; use adaptive evidence and stop repeated testing when the decision is already resolved.
    provenance:
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: GOV-015
    status: ACTIVE
    scope: BAD_PLAY_DIAGNOSIS
    statement: More training is not the default explanation for bad play; first investigate semantics, evaluator, representation, sampling, objective/traversal, action mapping, and training/runtime parity.
    provenance:
      - AGENTS.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: GOV-016
    status: ACTIVE
    scope: CONTRACT_CHANGE
    statement: Active invariants may only be changed by explicit adjudication that records the reason, affected IDs, evidence or new requirement, and supersession relation.
    provenance:
      - PROJECT_CONTRACT.yaml
  - id: GOV-017
    status: ACTIVE
    scope: PROJECT_HISTORY
    statement: Historical experimental results are evidence, not automatically active invariants; decisions frozen from those results become invariants and superseded decisions remain traceable.
    provenance:
      - docs/PROJECT_CONTRACT_MIGRATION_20260929.md

  - id: GOV-018
    status: ACTIVE
    scope: FINITE_EXPERIMENTAL_PROGRAMS
    statement: >
      A bounded research gate must retain a finite exit contract. Internal
      diagnostics or mechanical recovery do not create new roadmap stages, and
      repeated subgates may not be invented merely to avoid a PASS/FAIL/fallback
      decision already defined by the active experiment.
    provenance:
      - validation/R7_5_FINITE_CLOSURE_AND_COMPUTE_POLICY_20260816.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: GOV-019
    status: ACTIVE
    scope: FAILED_OR_BLOCKED_GATES
    statement: >
      A FAIL/BLOCKED result does not authorize seed shopping, threshold
      relaxation, dropping failed domains/rows, or an unbounded chain of
      remediation attempts. Further work requires the predeclared fallback or an
      explicit architecture/contract decision.
    provenance:
      - validation/R7_5_FINITE_CLOSURE_AND_COMPUTE_POLICY_20260816.md
      - contracts/chance_rng_reproducibility.yaml

  - id: GOV-020
    status: ACTIVE
    scope: EXECUTION_STATUS
    statement: >
      Distinguish STAGNATED, LONG_RUNNING, and BLOCKED execution. STAGNATED
      means credible forward progress is lost and requires immediate diagnosis;
      LONG_RUNNING means slow but credible compute that should normally preserve
      already-spent valid work; BLOCKED means a required gate/dependency is
      absent and downstream execution is unauthorized. Process liveness or
      elapsed time never implies PASS.
    provenance:
      - validation/PROJECT_EXECUTION_STAGNATION_PROTOCOL_20260812.md
  - id: GOV-021
    status: ACTIVE
    scope: EXECUTION_OBSERVABILITY
    statement: >
      Runtime pressure may not be solved by relaxing strategic gates, seeds,
      sample counts, RNG semantics, or strategy parameters. Heartbeat and
      observability changes must be semantically inert and may not consume
      application RNG, mutate training state, alter command arguments, or
      redefine child-process exit semantics.
    provenance:
      - validation/PROJECT_EXECUTION_STAGNATION_PROTOCOL_20260812.md

  - id: GOV-022
    status: ACTIVE
    scope: CONTRACT_CONTINUOUS_MAINTENANCE
    statement: >
      The project contract is a living source of truth. Every new durable
      project decision, accepted/rejected architecture, frozen gate, changed
      invariant, resolved conflict, or newly discovered rule that should
      constrain future work must update the relevant contract module and its
      enforcement/provenance in the same decision cycle. COMPLETE is a
      continuously maintained state, not a one-time historical certification.
    provenance:
      - PROJECT_CONTRACT.yaml
      - user_decision_2026-09-29_contract_must_be_dynamic

  - id: GOV-023
    status: ACTIVE
    scope: TECHNICAL_RECOMMENDATIONS_DURING_LONG_COMPUTE
    statement: >
      Before recommending that a long-running valid computation simply continue
      unchanged, evaluate whether a materially better continuation path exists.
      At minimum inspect checkpoint/resume granularity, remaining workload,
      current bottleneck, prior optimization precedents, semantic-parity risk,
      migration cost, and expected break-even. Preserve already-spent valid work,
      but do not default to waiting when a safe higher-throughput continuation
      may dominate.
    provenance:
      - contracts/performance_and_hardware.yaml
      - user_feedback_2026-09-29_semantic_long_recommendation_review
