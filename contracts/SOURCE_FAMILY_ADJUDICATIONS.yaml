schema: SPINCORE_CONTRACT_SOURCE_FAMILY_ADJUDICATIONS_V1
date: "2026-09-29"
purpose: >
  Review historical evidence families through authoritative closure/selection
  documents. Explicit per-source overrides always take precedence. A family
  classification does not delete historical evidence; it only states that the
  family is no longer an independent source of active project invariants after
  the listed closure decisions, except where a source is individually overridden.
families:
  - id: HIST-R7_3
    pattern: "validation/R7_3_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - validation/R7_4_FINAL_GATE.json
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
    rationale: >
      R7.3 candidate experiments and fit/variance screens fed the later R7.4
      provisional line. The current lean functional architecture supersedes
      their candidate-specific gates while permanent mechanics such as exact
      resume and deterministic audits are separately migrated into the contract.
  - id: HIST-R7_4
    pattern: "validation/R7_4_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - validation/R7_4_FINAL_GATE.json
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
    rationale: >
      R7.4 closed the recovered pre-lean line and authorized later engineering,
      but its candidate-specific quality gates are not the active LT2/LT3
      training contract. Reusable mechanics are separately migrated.
  - id: HIST-R7_5_3
    pattern: "validation/R7_5_3*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - validation/R7_5_FINITE_CLOSURE_AND_COMPUTE_POLICY_20260816.md
      - validation/R7_5_ARCH_RESET_V1PLUS_CLOSURE_AND_V1_FALLBACK_SELECTION_20260825.md
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
    rationale: >
      The bounded R7.5.3 representation-admission/remediation line is historical.
      Its successor investigations closed without a richer winner and the
      certified-stable V1 fallback was selected. Anti-tuning, finite-exit,
      chance/RNG, and compute-placement lessons are separately active.
  - id: HIST-R7_5_ARCH_RESET
    pattern: "validation/R7_5_ARCH_RESET_V1PLUS_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - validation/R7_5_ARCH_RESET_V1PLUS_CLOSURE_AND_V1_FALLBACK_SELECTION_20260825.md
      - docs/LEGACY_292_FEATURE_AUDIT.md
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
    rationale: >
      Phase2A/B/C V1+ architecture-reset experiments are closed historical
      evidence. The binding outcome is the stable SPNNIV1 fallback selection;
      no Phase2C3, larger-K, post-hoc estimator repair, or implicit SPNNIV3
      production promotion remains authorized.
  - id: HIST-R7_5_4
    pattern: "validation/R7_5_4*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - validation/R7_5_4_ACTION_ABSTRACTION_SOURCE_AUDIT_20260813.md
    rationale: >
      R7.5.4 action-abstraction experiments were candidate-specific and include
      fixed-10/20-localized evidence. The active lean LT2/LT3 action contract is
      the later full-distribution legacy-derived seven-action baseline; reusable
      exact-action and dedup semantics are separately migrated.

  - id: HIST-LT1
    pattern: "docs/LT1_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/LONG_TRAINING_PLAN.md
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - docs/RYZEN_OPTIMIZATION_POLICY.md
    rationale: >
      LT1 completion and fit-optimization records remain historical evidence for
      how the lean training line reached its later execution profile. Their
      stage-specific continuation authorizations were superseded by completed
      LT2/LT3 work; reusable Ryzen and batching principles are separately active.
  - id: HIST-LT2
    pattern: "docs/LT2_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/LT2_HU_ENS8_FINAL_HOLDOUT_RESULT_20260921.md
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
      - docs/LONG_TRAINING_PLAN.md
    rationale: >
      The intermediate LT2 diagnostic, refit, variance, policy-chain and
      continuation documents are historical evidence feeding the accepted
      ENS8@8100 baseline and later LT3 research line. Explicit overrides retain
      the final holdout, runtime, deployment and other documents whose decisions
      remain active; the remaining stage-local next-step instructions are
      superseded.
  - id: HIST-R7_5_GENERAL
    pattern: "validation/R7_5_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - validation/R7_5_ARCH_RESET_V1PLUS_CLOSURE_AND_V1_FALLBACK_SELECTION_20260825.md
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
    rationale: >
      Remaining R7.5 design/audit/recovery artifacts are preserved as historical
      evidence. The bounded representation successor line closed on the stable V1
      fallback and the later lean full-distribution architecture defines the
      active policy/action contract. Explicitly migrated source overrides retain
      any general invariants still active.
  - id: HIST-GOVERNANCE-FRONTIER
    pattern: "validation/GOVERNANCE_FRONTIER_*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - validation/R7_5_ARCH_RESET_V1PLUS_CLOSURE_AND_V1_FALLBACK_SELECTION_20260825.md
      - docs/PROJECT_CONTRACT_MIGRATION_20260929.md
    rationale: >
      Governance-frontier JSON files are dated snapshots of which historical
      experiment was next. They are superseded by the closed V1+ investigation,
      current ROADMAP chronology, and machine-readable project contract.
  - id: HIST-R8
    pattern: "validation/R8*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
    rationale: >
      The old R8 production-profile/training sequence was designed for the
      recovered R7 mechanism and is not the active LT2/LT3 training route.
      General strategic-profile, artifact, fail-closed and compute principles
      that remain useful have been migrated into the current contract.
  - id: HIST-R9
    pattern: "validation/R9*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
    rationale: >
      The old R9 finite strategic-audit stage is not the active promotion
      sequence. Its reusable identity, sentinels, pathology, anti-tuning and
      per-domain safeguards are represented directly in the current contract.
  - id: HIST-R10
    pattern: "validation/R10*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/LT2_OPENHOLDEM_RUNTIME_INTEGRATION_20260921.md
      - docs/LT2_NATIVE_OPENHOLDEM_SHADOW_ENGINE_RESULT_20260921.md
    rationale: >
      The old R10 gate sequence predates and is superseded by the physically
      validated LT2 OpenHoldem runtime lineage. Its still-valid fail-closed,
      identity, audit-record and exact-action principles have been migrated.
  - id: HIST-R11
    pattern: "validation/R11*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/LT2_OPENHOLDEM_RUNTIME_INTEGRATION_20260921.md
      - docs/PROJECT_CONTRACT_MIGRATION_20260929.md
    rationale: >
      R11 is not an active mandatory stage in the current roadmap. Its safe
      exploitation principles are retained conditionally under MODEL-030..032
      if opponent-specific exploitation is later enabled.
  - id: HIST-R12
    pattern: "validation/R12*"
    audit_status: SUPERSEDED_EVIDENCE
    basis_sources:
      - docs/LT2_OPENHOLDEM_SHADOW_DLL_WINDOWS_MOCK_RESULT_20260921.md
      - docs/PROJECT_CONTRACT_MIGRATION_20260929.md
    rationale: >
      The old R12 numbered homologation sequence is not the current roadmap.
      Its reusable immutable-release, shadow/fault/replay and end-to-end action
      verification requirements are retained conditionally under OH-019..021.
