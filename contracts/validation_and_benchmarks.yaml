schema: SPINCORE_CONTRACT_MODULE_V1
module_id: VALID_BENCH_DC
status: COMPLETE
invariants:
  - id: VALID-001
    status: ACTIVE
    scope: POLICY_QUALITY
    statement: Prefer controlled paired chip-EV evaluation under representative states over raw monetary tournament outcomes when measuring policy quality.
    provenance:
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: VALID-002
    status: ACTIVE
    scope: DEVELOPMENT_VS_HOLDOUT
    statement: Development evidence cannot by itself authorize a promotion reserved for a sealed holdout or a later canonical gate.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
      - docs/LT3_POST9105_DEVELOPMENT_BATTERY_PROTOCOL_20260922.md
  - id: VALID-003
    status: ACTIVE
    scope: PAIRED_STATISTICS
    statement: Where the protocol uses paired confidence intervals, POSITIVE means CI95 lower bound greater than zero, NEGATIVE means CI95 upper bound less than zero, otherwise INCONCLUSIVE.
    provenance:
      - docs/LT3_POST9105_DEVELOPMENT_BATTERY_PROTOCOL_20260922.md
  - id: DC-001
    status: ACTIVE
    scope: DEEPCRUSHER_EXTERNAL_STRENGTH_LANE
    statement: DC0 real-OpenHoldem action and sizing parity is required before a DeepCrusher comparison can authorize a canonical strength claim.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
      - CURRENT_WORK.md
  - id: DC-002
    status: ACTIVE
    scope: PRE_DC0_PARITY
    statement: DC1 may run before final OpenHoldem parity only as DEVELOPMENT_ONLY mechanical or strategic diagnostic evidence; reports must not claim canonical superiority or inferiority.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: SAFE-001
    status: ACTIVE
    scope: STRATEGIC_EVALUATION
    statement: Aggregate EV is necessary but not sufficient; retain decision traces and sanity/pathology review surfaces for gross strategic errors.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: SAFE-002
    status: ACTIVE
    scope: SEMANTIC_LONG_10115_10315
    statement: Milestone guards are pathology stops, not model-selection criteria; a failed milestone stops the run and cannot promote an earlier milestone post hoc.
    provenance:
      - ROADMAP.md
      - tools/run_3h_semantic_long_10115_10315.py

  - id: BENCH-001
    status: ACTIVE
    scope: DEEPCRUSHER_CANONICAL_BENCHMARK
    statement: The canonical initial external opponent is frozen DeepCrusher R8 v22; a later R9 or other opponent may be added but may not silently replace historical R8 v22 results.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-002
    status: ACTIVE
    scope: DEEPCRUSHER_CANONICAL_BENCHMARK
    statement: Comparisons use paired realistic scenarios and the same complete deals wherever practical, with policy assignments or seats swapped so card and position luck cannot determine the result.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-003
    status: ACTIVE
    scope: DEEPCRUSHER_CANONICAL_BENCHMARK
    statement: Each strategy retains its own exact action sizing; DeepCrusher is not projected into SpinCore's action abstraction and SpinCore continues to use the sizes its policy learned.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-004
    status: ACTIVE
    scope: HU_DEEPCRUSHER_BENCHMARK
    statement: Each sampled HU state/deal is evaluated in a two-game seat-swap pair so each policy receives the same card and position opportunities.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-005
    status: ACTIVE
    scope: THREE_HANDED_DEEPCRUSHER_BENCHMARK
    statement: Each sampled 3H state/deal uses the canonical six-game AAB/ABB rotation, yielding equal policy-seat exposure, equal logical-seat exposure, and zero-sum accounting.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-006
    status: ACTIVE
    scope: DC2
    statement: DC2 starts with at least 100000 sampled states and extends in chunks only when confidence precision can change the decision; sample-count ceremony alone does not justify more compute.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-007
    status: ACTIVE
    scope: DC2_QUALIFICATION
    statement: Qualification requires overall paired SpinCore-minus-DeepCrusher chip EV above zero, CI95 lower bound above zero, no major-domain collapse hidden by an isolated subgroup, and no material illegal-action or action-translation rate.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
      - ROADMAP.md
  - id: BENCH-008
    status: ACTIVE
    scope: DC3
    statement: Full-tournament benchmarking may begin only after continuous tournament semantics are separately frozen, including starting stacks, dealer movement, blind progression, 3H-to-HU transition, elimination/tie semantics, and paired card seeding.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: DC-003
    status: ACTIVE
    scope: DC0
    statement: Canonical DeepCrusher admission requires structural OpenPPL/source fidelity, faithful relevant symbol definitions, preserved action sizing/all-in semantics, and representative deterministic parity against the frozen OpenHoldem strategy.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: DC-004
    status: ACTIVE
    scope: DC1
    statement: DC1 is a mechanical smoke at approximately 1000 to 5000 sampled states and must verify legality, state convergence, pairing balance, zero-sum accounting, and exact sizing before scale-up.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md

  - id: VALID-010
    status: ACTIVE
    scope: LT3_PROMOTION
    statement: The sealed LT3 holdout may be opened only after all research choices for the candidate are frozen; no sealed-holdout result may be used to tune or add a candidate post hoc.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
  - id: VALID-011
    status: ACTIVE
    scope: SEALED_HOLDOUT_FAILURE
    statement: A failed sealed holdout is reported as failure and its seeds are not reused for tuning; subsequent research requires a genuinely new preregistered protocol rather than threshold relaxation on the opened holdout.
    provenance:
      - docs/LT2_HU_ENS8_FINAL_HOLDOUT_PROTOCOL_20260921.md
  - id: VALID-012
    status: ACTIVE
    scope: LT2_FINAL_HOLDOUT
    statement: The completed LT2 ENS8 final holdout is not rerun or tuned against; its PASS remains historical validation evidence for the frozen LT2 candidate rather than reusable development data.
    provenance:
      - docs/LT2_HU_ENS8_FINAL_HOLDOUT_RESULT_20260921.md

  - id: VALID-020
    status: ACTIVE
    scope: POST_10315_AVERAGE_POLICY_REBUILD
    statement: The ordinary semantic tail passes only if semantic weighted CE is at least 10 percent better than V1, semantic weighted TV at least 15 percent better than V1, high-card/no-draw absolute bias at least 50 percent better than V1, and semantic CE at least 10 percent better than the step-0 semantic model, on the independent postlong evaluation stream.
    provenance:
      - tools/build_3h_semantic_postlong_policy_10315.py
  - id: VALID-021
    status: ACTIVE
    scope: POST_10315_FULLPOOL_REBUILD
    statement: The full-pool general model passes only if global semantic CE and TV are no more than 2 percent worse than the ordinary tail, high-card/no-draw absolute bias is no more than 1 percentage point worse, and strong-hand Fold absolute bias is not worse than the ordinary tail.
    provenance:
      - tools/build_3h_semantic_postlong_policy_10315.py
  - id: VALID-022
    status: ACTIVE
    scope: POST_10315_SPECIALIST_MULTISEED
    statement: >
      The rebuilt specialist must pass four new 120000-episode streams. Each
      seed must contain at least 600 unique strong states and 20 high-target
      states; pooled evidence must contain at least 2400 strong and 100
      high-target states. Pooled CE and TV must each improve by at least 10
      percent versus full-pool; pooled Fold bias, low-target mean, low-target
      p95, straight/flush bias, and river bias must each improve by at least 30
      percent; pooled high-target bias may worsen by at most 1 percentage point;
      no seed may worsen high-target bias by more than 5 points or regress CE.
    provenance:
      - tools/audit_3h_semantic_stratified_specialist_multiseed_10315.py
  - id: VALID-023
    status: ACTIVE
    scope: POST_10315_DC1_5K
    statement: >
      The fresh-seed 5000-scenario DC1 comparison uses seed 20261001 and the
      same scenario identities for frozen 10105, accepted specialist 10115, and
      rebuilt specialist 10315. Safety requires all evaluators PASS, exact HU
      parity, positive 10315-minus-10105 3H mean with CI95 lower bound above
      zero, trips-Fold rate no more than 0.01 percentage point above 10115,
      high-card-jam rate no more than 10 percent above 10115, top-pair Fold,
      AA Fold and deep-72o-jam counts no more than 10115 plus one, and no new
      unexpected sanity code.
    provenance:
      - tools/run_deepcrusher_dc1_semantic_postlong_10315_5k.sh
  - id: VALID-024
    status: ACTIVE
    scope: POST_10315_INCREMENTAL_VALUE
    statement: In the post-10315 DC1 comparison, incremental 10315-versus-10115 evidence is POSITIVE_RESOLVED only when paired 3H mean is positive and its CI95 lower bound is above zero; positive mean with nonpositive lower bound is POSITIVE_INCONCLUSIVE; otherwise it is NO_POSITIVE_INCREMENT.
    provenance:
      - tools/run_deepcrusher_dc1_semantic_postlong_10315_5k.sh

  - id: VALID-013
    status: ACTIVE
    scope: R7_MODEL_FIT_AUDIT
    statement: >
      R7-family fit audits that rely on the preserved permanent audit contract
      must use deterministic stratified indices spanning the reservoir support
      rather than an arbitrary prefix or a result-dependent sample. The same
      inputs and audit seed must reproduce the same audit index set.
    provenance:
      - README.md
      - python/spincore/r7.py
      - python_tests/test_r7.py

  - id: VALID-025
    status: ACTIVE
    scope: DEVELOPMENT_BENCHMARK_DATA_ISOLATION
    statement: >
      Exact DC1 benchmark states, deals, sampled actions, and pathology examples
      may be used for diagnosis and replay but may not be inserted into candidate
      training or selection data unless a new explicitly preregistered experiment
      changes that rule before seeing its benchmark outcomes.
    provenance:
      - ROADMAP.md
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: BENCH-009
    status: ACTIVE
    scope: DC1_SCALEUP
    statement: >
      A larger DC1 development scale-up that is intended as new evidence uses a
      fresh scenario seed rather than merely extending the exact deterministic
      prefix already inspected in the smaller DC1 replay.
    provenance:
      - ROADMAP.md
      - tools/run_deepcrusher_dc1_stratified_specialist_5k.sh
  - id: VALID-026
    status: ACTIVE
    scope: ACCEPTED_10115_SPECIALIST_EVIDENCE
    statement: >
      The unchanged 10115 target-stratified specialist is admitted as the
      research architecture only because it passed four completely new
      120000-episode confirmation streams and then a fresh-seed 5000-scenario
      DC1 long-train-readiness gate. Earlier failed or post-hoc observations do
      not independently authorize promotion.
    provenance:
      - ROADMAP.md
      - tools/audit_3h_semantic_stratified_specialist_multiseed_10115.py
      - tools/run_deepcrusher_dc1_stratified_specialist_5k.sh

  - id: DC-005
    status: ACTIVE
    scope: FROZEN_DEEPCRUSHER_R8_BASELINE
    statement: >
      The canonical DeepCrusher reference is branch
      r8-v22-stable-20260914. Its operational OpenHoldem source must be exactly
      DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_ASCII_20260914.txt with SHA256
      0113badc99727a7dd47c02448d4d042b5e008534cd63fd79a461a72b24eeb68d;
      its strategic source is
      DeepCrusher_R8_v22_CANDIDATE_OPENHOLDEM_RECOVERED_20260914.txt with
      SHA256 9fc2d00aacc915f3c265429f764056f3c6270df616244026aac22e455c803ee9.
      A different source or hash is a different benchmark opponent.
    provenance:
      - python/spincore/deepcrusher_benchmark.py
      - python_tests/test_deepcrusher_benchmark_contract.py
  - id: DC-006
    status: ACTIVE
    scope: DEEPCRUSHER_DC0_SYMBOL_CLOSURE
    statement: >
      Canonical DC0 requires explicit semantics for every dependency reachable
      from f$preflop, f$flop, f$turn, and f$river. Missing reachable functions or
      unknown native symbols are blockers; benchmark code must never silently
      zero-fill an unknown strategic symbol.
    provenance:
      - python/spincore/deepcrusher_r8_dc0.py
      - python/spincore/deepcrusher_native_symbols.py
      - tools/audit_deepcrusher_r8_dc0_readiness.py
  - id: DC-007
    status: ACTIVE
    scope: DEEPCRUSHER_BENCHMARK_ENVIRONMENT
    statement: >
      The frozen non-strategic benchmark environment is
      GGPoker_NoPT_NoNotes_V1: network$ggpoker true and other networks false,
      PokerTracker and chair lookups OpenHoldem-undefined (-1), colour notes
      zero, log$ expressions true, and strategic prwin/prtie symbols are not
      supplied by this environment shim.
    provenance:
      - python/spincore/deepcrusher_native_symbols.py
      - python_tests/test_deepcrusher_native_symbols.py
  - id: DC-008
    status: ACTIVE
    scope: DEEPCRUSHER_PRELLOP_RANGE_EQUITY
    statement: >
      Frozen R8 preflop versus-multiplex support is restricted to range ids
      4, 6, 9, 12, and 15 using the hash-pinned 169-class equity table. R8's
      consumed value prwin + 0.5*prtie is preserved behaviorally as stored equity
      with prtie zero; unrelated multiplex functions and non-preflop use fail
      closed.
    provenance:
      - python/spincore/deepcrusher_preflop_equity.py
      - python/spincore/deepcrusher_native_symbols.py
      - python_tests/test_deepcrusher_preflop_equity.py
  - id: DC-009
    status: ACTIVE
    scope: DEEPCRUSHER_STATE_AND_SUITS
    statement: >
      Canonical DeepCrusher decisions use a lossless observable state view and
      exact deal-snapshot suit ids when suit-tie semantics can affect OpenHoldem
      symbols. Canonicalized suit-equivalence labels are acceptable only for
      static/unit contexts and are not a substitute for exact-suit benchmark
      semantics.
    provenance:
      - python/spincore/deepcrusher_state.py
      - python/spincore/deepcrusher_policy.py
  - id: DC-010
    status: ACTIVE
    scope: DEEPCRUSHER_OPENPPL_LIFECYCLE
    statement: >
      Every synthetic paired benchmark hand creates isolated OpenPPL sessions per
      DeepCrusher seat. Startup, hand-reset, new-round, and my-turn callbacks are
      replayed in OpenHoldem order, preventing connection-level memory from one
      paired replay from leaking into another.
    provenance:
      - python/spincore/deepcrusher_policy.py
  - id: DC-011
    status: ACTIVE
    scope: DEEPCRUSHER_HISTORY_SYMBOLS
    statement: >
      History symbols are reconstructed from the complete ordered public action
      transcript, while exact hero action-origin metadata preserves OpenHoldem's
      distinction between minimum Raise-button actions and f$betsize actions.
      Origin/history length mismatches fail closed.
    provenance:
      - python/spincore/deepcrusher_history_symbols.py
      - python/spincore/deepcrusher_action.py
      - python_tests/test_deepcrusher_history_symbols.py
  - id: BENCH-010
    status: ACTIVE
    scope: EXACT_EXTERNAL_ACTION_APPLICATION
    statement: >
      DeepCrusher exact Fold/Check/Call/BetTo/RaiseTo/AllIn actions are applied
      directly through the solver's exact-action ABI. Bet and raise amount_to
      values are never quantized into SpinCore's seven-action abstraction.
    provenance:
      - python/spincore/deepcrusher_benchmark.py
      - python_tests/test_deepcrusher_exact_action_bridge.py
      - python_tests/test_deepcrusher_benchmark_contract.py
  - id: BENCH-011
    status: ACTIVE
    scope: DEEPCRUSHER_ACTION_TRANSLATION
    statement: >
      OpenPPL action translation preserves OpenHoldem semantics: positive return
      values are final f$betsize values in big blinds; -1000 <= value < 0 is a
      pot fraction; values below -1000 are fixed action codes; zero is
      check/fold; RaiseTo is a final BB wager; RaiseBy adds to ncallbets; and
      unavailable aggression falls back through OpenPPL's legal passive-action
      behavior.
    provenance:
      - python/spincore/deepcrusher_action.py
  - id: BENCH-012
    status: ACTIVE
    scope: DEEPCRUSHER_ACTION_ROUNDING
    statement: >
      Offline exact-action translation uses deterministic half-up rounding only
      when a fractional chip target must become an integer simulator amount and
      then clamps to exact legal min/max bounds. This convention remains
      provisional until real OpenHoldem action+sizing parity fixtures validate
      it and cannot itself satisfy DC0.
    provenance:
      - python/spincore/deepcrusher_action.py
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: BENCH-013
    status: ACTIVE
    scope: BENCHMARK_ZERO_SUM_AND_EXPOSURE_BALANCE
    statement: >
      Every benchmark hand must conserve chips and every balanced scenario block
      must give equal policy exposure. A non-zero-sum terminal row, unequal
      policy exposure, or non-zero aggregate policy total is a hard benchmark
      error.
    provenance:
      - python/spincore/deepcrusher_benchmark.py
      - tools/evaluate_deepcrusher_dc1.py
      - python_tests/test_deepcrusher_benchmark_contract.py
  - id: BENCH-014
    status: ACTIVE
    scope: DC1_RUNTIME_ARTIFACTS
    statement: >
      Multiprocess DC1 may load only a compact inference bundle, not a multi-GB
      training checkpoint. Worker processes use one Torch/OpenMP/BLAS thread
      each, the scenario sampler is the canonical empirical SpinGo sampler, and
      every scenario/deal identity is fixed before parallel execution.
    provenance:
      - tools/evaluate_deepcrusher_dc1.py
      - docs/RYZEN_OPTIMIZATION_POLICY.md

  - id: VALID-030
    status: ACTIVE
    scope: MODEL_DIAGNOSIS_FROM_SAMPLED_TARGETS
    statement: >
      Raw model-to-sampled-target MSE is not sufficient evidence for network
      capacity, representation, or optimizer failure when target generation is
      Monte-Carlo. Before changing model capacity on that basis, quantify or
      otherwise control the conditional target variance relevant to the claimed
      failure.
    provenance:
      - docs/LT2_REPEATED_TARGET_VARIANCE_RESULT_20260917.md
      - docs/LT2_HU_PREFLOP_CONDITIONAL_RESAMPLING_RESULT_20260917.md
  - id: VALID-031
    status: ACTIVE
    scope: SPARSE_DIAGNOSTIC_SUBSETS
    statement: >
      Sparse exact-duplicate or rare-subset evidence must report coverage and
      may not be extrapolated as a global decomposition or policy conclusion.
      A predeclared sparse-coverage branch takes precedence over a tempting
      numerical split from an unrepresentative subset.
    provenance:
      - docs/LT2_SAME_INPUT_TARGET_VARIANCE_RESULT_20260917.md
  - id: VALID-032
    status: ACTIVE
    scope: ESTIMATOR_TO_STRATEGY_PROMOTION
    statement: >
      A lower-variance or lower-MSE target estimator is not automatically a
      stronger playing policy. Mechanical estimator improvements authorize only
      the next bounded causal training/evaluation gate declared in advance.
    provenance:
      - docs/LT2_HU_PREFLOP_BOARD_AVERAGING_SMOKE_RESULT_20260918.md
      - docs/LT2_HU_PREFLOP_BOARD_ONLY_AVERAGING_RESULT_20260918.md

  - id: SAFE-010
    status: ACTIVE
    scope: DEPLOYMENT_OR_CANONICAL_PROMOTION
    statement: >
      Canonical/extreme strategic sentinels must combine exact integrity
      fingerprints with independently precommitted poker-plausibility checks.
      The sentinel corpus must cover HU and 3H separately, materially different
      stack depths, strong and weak holdings, and relevant facing-action/payout
      contexts. A failed strategic bound is investigated rather than weakened
      after observing the candidate.
    provenance:
      - validation/R9_STRATEGIC_AUDIT_GATE_DESIGN_20260812.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: SAFE-011
    status: ACTIVE
    scope: POLICY_PATHOLOGY_AUDIT
    statement: >
      Aggregate fit or EV metrics cannot replace broad pathology review. Before
      canonical promotion, audit for nonfinite/illegal probability mass,
      accidental one-action collapse, unreachable action IDs, wrong HU/3H
      routing, unintended identity-equivalent outputs across distinct strategic
      profiles, and malformed-state discontinuities.
    provenance:
      - validation/R9_STRATEGIC_AUDIT_GATE_DESIGN_20260812.md
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: VALID-033
    status: ACTIVE
    scope: MULTI_DOMAIN_PROMOTION
    statement: >
      Promotion evidence is reported separately for every required strategy
      domain/profile. A strong aggregate or a passing HU policy cannot mask
      missing or failed 3H evidence, and vice versa.
    provenance:
      - validation/R9_STRATEGIC_AUDIT_GATE_DESIGN_20260812.md
      - docs/LT3_POST9105_DEVELOPMENT_BATTERY_PROTOCOL_20260922.md
