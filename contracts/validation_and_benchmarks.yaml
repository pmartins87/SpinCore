schema: SPINCORE_CONTRACT_MODULE_V1
module_id: VALID_BENCH_DC
status: PARTIAL_AUDIT
invariants:
  - id: VALID-001
    status: ACTIVE
    scope: POLICY_QUALITY
    statement: Prefer controlled paired chip-EV evaluation under representative states over raw monetary tournament outcomes when measuring policy quality.
    provenance:
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
  - id: VALID-002
    status: ACTIVE
    scope: DEVELOPMENT_VS_HOLDOUT
    statement: Development evidence cannot by itself authorize a promotion reserved for a sealed holdout or a later canonical gate.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
      - docs/LT3_POST9105_DEVELOPMENT_BATTERY_PROTOCOL_20260922.md
  - id: VALID-003
    status: ACTIVE
    scope: PAIRED_STATISTICS
    statement: Where the protocol uses paired confidence intervals, POSITIVE means CI95 lower bound greater than zero, NEGATIVE means CI95 upper bound less than zero, otherwise INCONCLUSIVE.
    provenance:
      - docs/LT3_POST9105_DEVELOPMENT_BATTERY_PROTOCOL_20260922.md
  - id: DC-001
    status: ACTIVE
    scope: DEEPCRUSHER_EXTERNAL_STRENGTH_LANE
    statement: DC0 real-OpenHoldem action and sizing parity is required before a DeepCrusher comparison can authorize a canonical strength claim.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
      - CURRENT_WORK.md
  - id: DC-002
    status: ACTIVE
    scope: PRE_DC0_PARITY
    statement: DC1 may run before final OpenHoldem parity only as DEVELOPMENT_ONLY mechanical or strategic diagnostic evidence; reports must not claim canonical superiority or inferiority.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: SAFE-001
    status: ACTIVE
    scope: STRATEGIC_EVALUATION
    statement: Aggregate EV is necessary but not sufficient; retain decision traces and sanity/pathology review surfaces for gross strategic errors.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: SAFE-002
    status: ACTIVE
    scope: SEMANTIC_LONG_10115_10315
    statement: Milestone guards are pathology stops, not model-selection criteria; a failed milestone stops the run and cannot promote an earlier milestone post hoc.
    provenance:
      - ROADMAP.md
      - tools/run_3h_semantic_long_10115_10315.py

  - id: BENCH-001
    status: ACTIVE
    scope: DEEPCRUSHER_CANONICAL_BENCHMARK
    statement: The canonical initial external opponent is frozen DeepCrusher R8 v22; a later R9 or other opponent may be added but may not silently replace historical R8 v22 results.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-002
    status: ACTIVE
    scope: DEEPCRUSHER_CANONICAL_BENCHMARK
    statement: Comparisons use paired realistic scenarios and the same complete deals wherever practical, with policy assignments or seats swapped so card and position luck cannot determine the result.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-003
    status: ACTIVE
    scope: DEEPCRUSHER_CANONICAL_BENCHMARK
    statement: Each strategy retains its own exact action sizing; DeepCrusher is not projected into SpinCore's action abstraction and SpinCore continues to use the sizes its policy learned.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-004
    status: ACTIVE
    scope: HU_DEEPCRUSHER_BENCHMARK
    statement: Each sampled HU state/deal is evaluated in a two-game seat-swap pair so each policy receives the same card and position opportunities.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-005
    status: ACTIVE
    scope: THREE_HANDED_DEEPCRUSHER_BENCHMARK
    statement: Each sampled 3H state/deal uses the canonical six-game AAB/ABB rotation, yielding equal policy-seat exposure, equal logical-seat exposure, and zero-sum accounting.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-006
    status: ACTIVE
    scope: DC2
    statement: DC2 starts with at least 100000 sampled states and extends in chunks only when confidence precision can change the decision; sample-count ceremony alone does not justify more compute.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: BENCH-007
    status: ACTIVE
    scope: DC2_QUALIFICATION
    statement: Qualification requires overall paired SpinCore-minus-DeepCrusher chip EV above zero, CI95 lower bound above zero, no major-domain collapse hidden by an isolated subgroup, and no material illegal-action or action-translation rate.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
      - ROADMAP.md
  - id: BENCH-008
    status: ACTIVE
    scope: DC3
    statement: Full-tournament benchmarking may begin only after continuous tournament semantics are separately frozen, including starting stacks, dealer movement, blind progression, 3H-to-HU transition, elimination/tie semantics, and paired card seeding.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: DC-003
    status: ACTIVE
    scope: DC0
    statement: Canonical DeepCrusher admission requires structural OpenPPL/source fidelity, faithful relevant symbol definitions, preserved action sizing/all-in semantics, and representative deterministic parity against the frozen OpenHoldem strategy.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md
  - id: DC-004
    status: ACTIVE
    scope: DC1
    statement: DC1 is a mechanical smoke at approximately 1000 to 5000 sampled states and must verify legality, state convergence, pairing balance, zero-sum accounting, and exact sizing before scale-up.
    provenance:
      - docs/DEEPC_RUSHER_BENCHMARK_SPEC.md

  - id: VALID-010
    status: ACTIVE
    scope: LT3_PROMOTION
    statement: The sealed LT3 holdout may be opened only after all research choices for the candidate are frozen; no sealed-holdout result may be used to tune or add a candidate post hoc.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
  - id: VALID-011
    status: ACTIVE
    scope: SEALED_HOLDOUT_FAILURE
    statement: A failed sealed holdout is reported as failure and its seeds are not reused for tuning; subsequent research requires a genuinely new preregistered protocol rather than threshold relaxation on the opened holdout.
    provenance:
      - docs/LT2_HU_ENS8_FINAL_HOLDOUT_PROTOCOL_20260921.md
  - id: VALID-012
    status: ACTIVE
    scope: LT2_FINAL_HOLDOUT
    statement: The completed LT2 ENS8 final holdout is not rerun or tuned against; its PASS remains historical validation evidence for the frozen LT2 candidate rather than reusable development data.
    provenance:
      - docs/LT2_HU_ENS8_FINAL_HOLDOUT_RESULT_20260921.md

  - id: VALID-020
    status: ACTIVE
    scope: POST_10315_AVERAGE_POLICY_REBUILD
    statement: The ordinary semantic tail passes only if semantic weighted CE is at least 10 percent better than V1, semantic weighted TV at least 15 percent better than V1, high-card/no-draw absolute bias at least 50 percent better than V1, and semantic CE at least 10 percent better than the step-0 semantic model, on the independent postlong evaluation stream.
    provenance:
      - tools/build_3h_semantic_postlong_policy_10315.py
  - id: VALID-021
    status: ACTIVE
    scope: POST_10315_FULLPOOL_REBUILD
    statement: The full-pool general model passes only if global semantic CE and TV are no more than 2 percent worse than the ordinary tail, high-card/no-draw absolute bias is no more than 1 percentage point worse, and strong-hand Fold absolute bias is not worse than the ordinary tail.
    provenance:
      - tools/build_3h_semantic_postlong_policy_10315.py
  - id: VALID-022
    status: ACTIVE
    scope: POST_10315_SPECIALIST_MULTISEED
    statement: >
      The rebuilt specialist must pass four new 120000-episode streams. Each
      seed must contain at least 600 unique strong states and 20 high-target
      states; pooled evidence must contain at least 2400 strong and 100
      high-target states. Pooled CE and TV must each improve by at least 10
      percent versus full-pool; pooled Fold bias, low-target mean, low-target
      p95, straight/flush bias, and river bias must each improve by at least 30
      percent; pooled high-target bias may worsen by at most 1 percentage point;
      no seed may worsen high-target bias by more than 5 points or regress CE.
    provenance:
      - tools/audit_3h_semantic_stratified_specialist_multiseed_10315.py
  - id: VALID-023
    status: ACTIVE
    scope: POST_10315_DC1_5K
    statement: >
      The fresh-seed 5000-scenario DC1 comparison uses seed 20261001 and the
      same scenario identities for frozen 10105, accepted specialist 10115, and
      rebuilt specialist 10315. Safety requires all evaluators PASS, exact HU
      parity, positive 10315-minus-10105 3H mean with CI95 lower bound above
      zero, trips-Fold rate no more than 0.01 percentage point above 10115,
      high-card-jam rate no more than 10 percent above 10115, top-pair Fold,
      AA Fold and deep-72o-jam counts no more than 10115 plus one, and no new
      unexpected sanity code.
    provenance:
      - tools/run_deepcrusher_dc1_semantic_postlong_10315_5k.sh
  - id: VALID-024
    status: ACTIVE
    scope: POST_10315_INCREMENTAL_VALUE
    statement: In the post-10315 DC1 comparison, incremental 10315-versus-10115 evidence is POSITIVE_RESOLVED only when paired 3H mean is positive and its CI95 lower bound is above zero; positive mean with nonpositive lower bound is POSITIVE_INCONCLUSIVE; otherwise it is NO_POSITIVE_INCREMENT.
    provenance:
      - tools/run_deepcrusher_dc1_semantic_postlong_10315_5k.sh
