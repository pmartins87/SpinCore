schema: SPINCORE_CONTRACT_MODULE_V1
module_id: ACT_REP
status: PARTIAL_AUDIT
invariants:
  - id: ACT-001
    status: ACTIVE
    scope: LEAN_FUNCTIONAL_ACTION_SPACE
    statement: The active seven action labels are FOLD, CHECK_CALL, POT_33, POT_50, POT_75, POT_100, ALL_IN carried in universal slots 0,1,3,5,7,8,9; slots 2,4,6 are dormant.
    provenance:
      - python/spincore/lean_action_scope.py
      - docs/LT2_OPENHOLDEM_RUNTIME_INTEGRATION_20260921.md
  - id: ACT-002
    status: ACTIVE
    scope: PREFLOP
    statement: POT_33 means normal open to 2.0 BB; POT_75 means isolation to 2.5 BB plus 1 BB per extra limper; POT_50 means 3-bet to 5.0 BB plus 2 BB per caller after the raise.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_action_scope.py
  - id: ACT-003
    status: ACTIVE
    scope: PREFLOP
    statement: Legacy branch restrictions are preserved for limp-vs-isolation and multi-raise trees; duplicate exact actions are deduplicated.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_action_scope.py
  - id: ACT-004
    status: ACTIVE
    scope: POSTFLOP
    statement: Fractional bet/raise sizes are 33/50/75/100 percent of pot after paying the call; illegal/unaffordable fractional raises are pruned and near-stack fractions collapse to all-in under the legacy approximately-60%-effective-stack rule.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_action_scope.py
  - id: ACT-005
    status: ACTIVE
    scope: RUNTIME
    statement: Exact OpenHoldem/runtime action amounts must use the canonical lean resolver rather than a second independent sizing implementation.
    provenance:
      - docs/LT2_OPENHOLDEM_RUNTIME_INTEGRATION_20260921.md
  - id: REP-001
    status: ACTIVE
    scope: LEAN_FUNCTIONAL_BASELINE
    statement: The canonical game state remains exact; compact neural encoding is only the network boundary.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
  - id: REP-002
    status: ACTIVE
    scope: SPNNIV1_LANE
    statement: SPNNIV1 uses the documented card, numeric, categorical, legal-mask, and public-history fields rather than the legacy 292-float feature vector.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
  - id: REP-003
    status: ACTIVE
    scope: HAND_SEMANTICS
    statement: Evaluator/features must distinguish board texture from Hero-contributed made-hand strength wherever strategically required; board-only categories must not be treated as Hero-made hands.
    provenance:
      - AGENTS.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md

  - id: REP-010
    status: ACTIVE
    scope: ALL_LEARNED_OBSERVATIONS
    statement: Every learned observation must be derived from an authoritative legally reachable game state and ordered public trajectory; derived features may summarize exact facts but may not replace, contradict, or synthesize impossible combinations of them.
    provenance:
      - validation/R7_5_FULL_PRIOR_ATTEMPT_HERITAGE_AUDIT_20260814.md
      - validation/R7_5_REAL_GAME_REACHABILITY_AUDIT.json
  - id: REP-011
    status: ACTIVE
    scope: CARD_AND_HISTORY_REPRESENTATION_DESIGN
    statement: A representation candidate may remove only explicitly proven game symmetries; it must preserve exact observable card information, private/public role, street chronology, strategically relevant suit relations, legal-action identity, and path-dependent betting information required by the strategy.
    provenance:
      - validation/R7_5_REPRESENTATION_INTEGRITY_AUDIT_20260814.md
      - validation/R7_5_FULL_PRIOR_ATTEMPT_HERITAGE_AUDIT_20260814.md
  - id: REP-012
    status: ACTIVE
    scope: PUBLIC_HISTORY
    statement: Path-dependent strategic context must be derived from the complete ordered public action trajectory rather than guessed from a late table snapshot when multiple legal histories can lead to the same instantaneous geometry.
    provenance:
      - validation/R7_5_FULL_PRIOR_ATTEMPT_HERITAGE_AUDIT_20260814.md
      - docs/LT2_OPENHOLDEM_RUNTIME_INTEGRATION_20260921.md
  - id: ACT-010
    status: ACTIVE
    scope: UNIVERSAL_ACTION_RESOLUTION
    statement: Nominal action primitives that resolve to the same exact action in a state must not remain as duplicate effective neural branches; exact action resolution and deterministic state-local deduplication are authoritative.
    provenance:
      - validation/R7_5_4_ACTION_ABSTRACTION_SOURCE_AUDIT_20260813.md
      - python/spincore/r7_5_action_cfr.py
  - id: ACT-011
    status: ACTIVE
    scope: ACTION_ABSTRACTION_SELECTION
    statement: Changing the action abstraction changes the strategic experiment; evidence collected under a different action set cannot be relabelled as evidence for the new abstraction, and candidate comparisons must control model capacity, seeds, roots, and exact-action aliases.
    provenance:
      - validation/R7_5_4_ACTION_ABSTRACTION_SOURCE_AUDIT_20260813.md

  - id: REP-013
    status: ACTIVE
    scope: LEAN_SPNNIV1_MODEL_FAMILY
    statement: The lean SPNNIV1 model family uses card and categorical embeddings, normalized numeric inputs, a public-history sequence encoder, and a 10-slot universal action carrier while the baseline exposes only its seven active legacy-derived actions.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - python/spincore/lean_functional_training.py
      - python/spincore/lean_action_scope.py
  - id: REP-014
    status: ACTIVE
    scope: LEGACY_292_FEATURES
    statement: The legacy 292-feature semantic vocabulary remains diagnostic and heritage material; it is not silently restored wholesale into the neural input without evidence of a concrete representational weakness and a declared contract change.
    provenance:
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md
      - validation/R7_5_FULL_PRIOR_ATTEMPT_HERITAGE_AUDIT_20260814.md

  - id: REP-015
    status: ACTIVE
    scope: CURRENT_LEAN_LT2_LT3_POLICY_INPUT
    statement: >
      SPNNIV1 is the active neural observation schema for the current lean
      functional LT2/LT3 policy lineage. Historical R7.5 SPNNIV3 work remains
      candidate/experimental evidence and may not become the current policy
      input implicitly or through generic package exports.
    provenance:
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - validation/R9_R12_SPNNIV3_MIGRATION_DEBT_AUDIT_20260816.json
  - id: REP-016
    status: ACTIVE
    scope: NON_POLICY_INTERNAL_CARRIERS
    statement: >
      Use of SPNNIV3 as an exact/lossless carrier for diagnostics or the
      DeepCrusher offline oracle does not redefine the current SpinCore policy
      network input. Representation identities are role-scoped and must not be
      conflated across training, deployment, benchmark-oracle, and diagnostic
      paths.
    provenance:
      - python/spincore/deepcrusher_state.py
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - validation/R7_5_REPRESENTATION_INTEGRITY_AUDIT_20260814.md
  - id: REP-017
    status: ACTIVE
    scope: LEGACY_R7_5_REPRESENTATION_EXPERIMENTS
    statement: >
      R7.5 representation candidates, including SPNNIV3 H2/H3 lineages, remain
      historical experimental evidence unless an explicit later contract
      promotes them under the representative real tournament distribution.
      Stale R9/R10 references to a presumed future R7.5.5 winner are not an
      implicit production selection.
    provenance:
      - validation/R7_5_REPRESENTATION_AND_ACTION_ABSTRACTION_PRECOMMIT_20260813.md
      - validation/R9_R10_SPNNIV3_GATE_DESIGN_ADJUDICATION_20260816.md
      - validation/R9_R12_SPNNIV3_MIGRATION_DEBT_AUDIT_20260816.json
  - id: ACT-012
    status: ACTIVE
    scope: CURRENT_LEAN_LT2_LT3_ACTION_ABSTRACTION
    statement: >
      The active lean LT2/LT3 strategic action abstraction is the legacy-derived
      seven-action vocabulary carried in ten universal slots. Historical R7.5
      action-set candidates A/B/C and fixed-10/20 ablations remain localized
      experiments and cannot silently supersede this action contract.
    provenance:
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - docs/FIRST_FUNCTIONAL_TRAINING_SPEC.md
      - validation/R7_5_REPRESENTATION_AND_ACTION_ABSTRACTION_PRECOMMIT_20260813.md
      - validation/R7_5_4_ACTION_ABSTRACTION_SOURCE_AUDIT_20260813.md
  - id: ACT-013
    status: ACTIVE
    scope: FUTURE_ACTION_ABSTRACTION_CHANGE
    statement: >
      Reopening the action abstraction requires representative full-distribution
      evidence and an explicit contract change. A larger action set is not
      preferred merely because it is more granular; additional branches must
      justify strategic benefit against tree-size and wall-clock cost.
    provenance:
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
      - validation/R7_5_REPRESENTATION_AND_ACTION_ABSTRACTION_PRECOMMIT_20260813.md
      - docs/LEGACY_BASELINE_AND_QUALITY_POLICY.md

  - id: REP-018
    status: ACTIVE
    scope: CURRENT_SPNNIV1_FALLBACK_INTERPRETATION
    statement: >
      SPNNIV1 is the selected stable fallback lineage after the bounded richer
      representation investigations failed their admission route. This selection
      does not claim that V1's absolute-card encoding or coarse history is
      strategically optimal; it preserves the certified-stable fallback until
      a later explicitly justified successor earns admission.
    provenance:
      - validation/R7_5_ARCH_RESET_V1PLUS_CLOSURE_AND_V1_FALLBACK_SELECTION_20260825.md
      - docs/LEGACY_292_FEATURE_AUDIT.md
      - docs/LEGACY_VS_SPINCORE_ARCHITECTURE_MAP.md
