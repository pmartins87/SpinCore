schema: SPINCORE_CONTRACT_MODULE_V1
module_id: CKPT_ART
status: PARTIAL_AUDIT
invariants:
  - id: CKPT-001
    status: ACTIVE
    scope: TRAINING
    statement: Long training must be resumable and checkpoint/resume must preserve the declared training state rather than silently restarting or changing semantics.
    provenance:
      - README.md
      - docs/RYZEN_OPTIMIZATION_POLICY.md
  - id: CKPT-002
    status: ACTIVE
    scope: HU_ENS8_LANES
    statement: The ordinary checkpoint and matched HU ENS8 sidecar are a mandatory pair; the ordinary checkpoint alone is not the current HU behavior.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
  - id: CKPT-003
    status: ACTIVE
    scope: FROZEN_SOURCE_ARTIFACTS
    statement: Frozen source checkpoints, sidecars, and raw milestones are read-only; derived finalization/evaluation must operate on copies when the source artifact is declared immutable.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
      - docs/LT3_POST9105_DEVELOPMENT_BATTERY_PROTOCOL_20260922.md
  - id: CKPT-004
    status: ACTIVE
    scope: SEMANTIC_LONG_10115_10315
    statement: The long semantic lane persists a resume state after every completed iteration and may resume only from a contract-valid completed iteration.
    provenance:
      - tools/run_3h_semantic_long_10115_10315.py
  - id: ART-001
    status: ACTIVE
    scope: CANONICAL_RUNS
    statement: Canonical results record source artifact identities/hashes, code provenance, sampler seeds, workload size, worker profile, metrics, and claim/parity status sufficient to prevent silent result replacement.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md
  - id: ART-002
    status: ACTIVE
    scope: BENCHMARK_HISTORY
    statement: Later results must not overwrite older canonical results; regression history is cumulative.
    provenance:
      - docs/DEEPCRUSHER_BENCHMARK_CONTRACT_20260917.md

  - id: CKPT-010
    status: ACTIVE
    scope: R7_EXACT_MID_ITERATION_RESUME
    statement: Exact mid-iteration checkpoints preserve model weights, optimizer states, both reservoirs, batch RNG, Torch RNG, counters, and explicit phase/root/traverser/optimizer progress so resume does not silently replay or skip work.
    provenance:
      - README.md
      - python/spincore/r7.py
  - id: CKPT-011
    status: ACTIVE
    scope: ATOMIC_CHECKPOINT_WRITES
    statement: Durable checkpoint writes use a temporary artifact followed by atomic replacement where the implementation declares atomic checkpoint semantics.
    provenance:
      - python/spincore/r7.py
      - python/spincore/lean_functional_training.py

  - id: ART-010
    status: ACTIVE
    scope: LT2_FROZEN_BASELINE
    statement: The accepted LT2 ENS8@8100 production checkpoint and matched ENS8 sidecar remain read-only while LT3 research proceeds; LT3 does not replace LT2 by construction.
    provenance:
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
      - ROADMAP.md

  - id: ART-011
    status: ACTIVE
    scope: LT2_FROZEN_HYBRID_DEPLOYMENT
    statement: >
      The frozen LT2 Python deployment bundle SHA256 is
      87e46b40cb43bb89cb46bf3b760bbac5c8282491fd3d6da73d1bbe28329b278c,
      sourced from iteration-8100 checkpoint
      a51dbbed71090e45f2c4f5db6297f72eab848990b38650702b436e2aa60ca4bf
      and HU ensemble
      c44b817f75304db352eedc33febbd180e6d038e0580c91be0b9befdbdb08f181.
      The validated native deployment binary SHA256 is
      2b79ab7ff746a9c1c3dd73dbc0a1d6884a471813cf34b9cb126790c4c4cbb123.
    provenance:
      - docs/LT2_HYBRID_DEPLOYMENT_PARITY_RESULT_20260921.md
      - docs/LT2_NATIVE_CPP_INFERENCE_PARITY_RESULT_20260921.md
  - id: ART-012
    status: ACTIVE
    scope: LT2_WINDOWS_SHADOW_DLL
    statement: >
      The exact x64 SpinCore_LT2_Shadow.dll that passed the Windows mock-host
      gate has SHA256
      7566be1b3c73207d437171c2b4e94f6a94477786a2a48599994a647808030062
      and is the only binary admitted to the first real x64 shadow-load gate.
    provenance:
      - docs/LT2_OPENHOLDEM_SHADOW_DLL_WINDOWS_MOCK_RESULT_20260921.md

  - id: CKPT-012
    status: ACTIVE
    scope: CHECKPOINTED_BEHAVIOR_STATE
    statement: >
      A checkpoint is resumable only if it preserves every state component that
      can change future behavior, not merely the primary model bundle. Ensemble
      side members, previous-generation ensembles, wrapper parameters, adaptive
      state, or equivalent sidecars must be serialized and integrity-checked
      whenever the active lane depends on them.
    provenance:
      - validation/R7_3_CANDIDATE_CHECKPOINT_READINESS_20260810.md
      - docs/LT3_HEAVY_TRAINING_PLAN_20260921.md
  - id: CKPT-013
    status: ACTIVE
    scope: DETERMINISTIC_RESTORE
    statement: >
      Restoring auxiliary/side models must not consume or perturb the restored
      global RNG streams. Module construction that would otherwise advance
      Torch RNG is isolated so stop-restore-continue can remain identical to
      continuous execution.
    provenance:
      - validation/R7_3_CANDIDATE_CHECKPOINT_READINESS_20260810.md
      - python/spincore/r7_candidate_checkpoint.py
  - id: CKPT-014
    status: ACTIVE
    scope: RESUME_EQUIVALENCE
    statement: >
      When exact resume equivalence is claimed, continuous execution and
      stop-checkpoint-fresh-restore-continue must match the declared behavioral
      state, including model and optimizer states, reservoir contents/order,
      counters, batch RNG, Torch RNG, stage/progress metadata, and any active
      side-model state.
    provenance:
      - validation/R7_4_STAGED_RESUME_EQUIVALENCE.json
      - validation/R7_3_CANDIDATE_CHECKPOINT_READINESS_20260810.md
  - id: ART-013
    status: ACTIVE
    scope: GITHUB_ARTIFACT_PERSISTENCE
    statement: >
      A workflow that persists an immutable computed artifact into Git must
      checkout the destination branch before downloading the artifact into the
      checkout workspace, then validate provenance before copy/add/commit/push.
      Downloading into the workspace before a clean checkout is forbidden
      because checkout may erase valid evidence.
    provenance:
      - validation/ARTIFACT_PERSISTENCE_ORDERING_INCIDENT_20260813.md
  - id: ART-014
    status: ACTIVE
    scope: SCIENTIFIC_ARTIFACT_RECOVERY
    statement: >
      A persistence-layer failure after successful immutable evidence creation
      does not by itself invalidate the scientific computation and must not
      trigger an unnecessary rerun. Recovery may persist the original immutable
      artifact after validating execution SHA, workflow/run identity, content
      digest, and gate metadata.
    provenance:
      - validation/ARTIFACT_PERSISTENCE_ORDERING_INCIDENT_20260813.md
